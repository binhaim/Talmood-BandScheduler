name: Deploy site and calendar feeds

on:
  push:
    branches: [main]
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install calendar dependencies
        run: npm ci

      - name: Verify calendar generator
        run: npm test

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Recover previous feed metadata
        continue-on-error: true
        run: curl --fail --silent --show-error --location https://binhaim.github.io/Talmood-BandScheduler/calendars/manifest.json --output /tmp/calendar-manifest.json

      - name: Generate member calendar feeds
        run: npm run generate:feeds -- --output _site/calendars --previous /tmp/calendar-manifest.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
