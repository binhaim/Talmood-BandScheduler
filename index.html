<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>밴드 합주 일정 조율</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f5f1e8; --surface:#fffdf7; --ink:#1a1814; --ink-2:#4a4640;
    --muted:#8a8478; --muted-2:#b5b0a2;
    --line:#ebe5d4; --line-2:#d9d2bd;
    --accent:#cf3d1e; --accent-d:#a8311a; --accent-soft:#fae6e0;
    --ok:#2d7549; --ok-soft:#e6f0e9;
    --warn-soft:#fde9e4;
    --r-sm:6px; --r:10px; --r-lg:14px;
    --t:160ms cubic-bezier(.4,0,.2,1);
    --shadow-sm:0 1px 2px rgba(26,24,20,.04);
    --shadow:0 4px 16px rgba(26,24,20,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:var(--paper);color:var(--ink);
    font-family:'Archivo',system-ui,-apple-system,sans-serif;
    font-size:14.5px;line-height:1.55;-webkit-text-size-adjust:100%;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
  body{padding-bottom:80px;}
  h1,h2,h3{font-family:'Bricolage Grotesque','Archivo',sans-serif;
    line-height:1.15;letter-spacing:-.02em;}
  .wrap{max-width:1400px;margin:0 auto;padding:0 20px;}

  /* header */
  header{border-bottom:1px solid var(--line);
    background:rgba(245,241,232,.85);backdrop-filter:saturate(180%) blur(10px);
    -webkit-backdrop-filter:saturate(180%) blur(10px);
    position:sticky;top:0;z-index:30;}
  .hbar{display:flex;align-items:center;gap:14px;padding:14px 0;flex-wrap:wrap;}
  .brand{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:22px;letter-spacing:-.03em;cursor:pointer;color:var(--ink);
    transition:opacity var(--t);user-select:none;}
  .brand:hover{opacity:.65;}
  .brand .dot{color:var(--accent);}
  .crumb{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;}
  .crumb .pname{color:var(--ink);font-weight:600;font-size:14px;}
  .crumb .sep{color:var(--muted-2);}
  .code-chip{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;
    font-weight:600;letter-spacing:.04em;background:var(--ink);color:var(--paper);
    padding:4px 10px;border-radius:999px;cursor:pointer;border:none;
    transition:opacity var(--t),transform var(--t);display:inline-flex;
    align-items:center;gap:5px;}
  .code-chip:hover{opacity:.82;}
  .code-chip:active{transform:scale(.96);}
  .code-chip svg{width:11px;height:11px;opacity:.7;}

  .tabs{display:flex;gap:2px;margin-left:auto;background:var(--paper);
    padding:3px;border-radius:8px;border:1px solid var(--line);}
  .tab{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:13px;
    padding:6px 14px;background:transparent;border:none;cursor:pointer;
    color:var(--muted);border-radius:5px;
    transition:color var(--t),background var(--t),box-shadow var(--t);}
  .tab:hover{color:var(--ink);}
  .tab.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow-sm);}

  /* layout */
  main{padding:28px 0 60px;}
  .card{background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);padding:22px;margin-bottom:14px;}
  .card h2{font-size:18px;font-weight:700;margin-bottom:4px;}
  .card .sub{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5;}
  .card-head{display:flex;justify-content:space-between;align-items:center;
    gap:12px;flex-wrap:wrap;margin-bottom:14px;}
  .card-head h2{margin:0;}
  .section-label{font-family:'Archivo',sans-serif;font-weight:600;font-size:11px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .section-label .count{color:var(--muted-2);font-weight:500;letter-spacing:.04em;}

  /* buttons */
  button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
  .btn{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);
    padding:9px 16px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;
    letter-spacing:-.005em;display:inline-flex;align-items:center;gap:6px;
    transition:background var(--t),border-color var(--t),
      color var(--t),opacity var(--t),transform var(--t);}
  .btn:hover{background:#2d2924;border-color:#2d2924;}
  .btn:active{transform:translateY(.5px);}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2);}
  .btn.ghost:hover{background:var(--paper);border-color:var(--ink);color:var(--ink);}
  .btn.accent{background:var(--accent);border-color:var(--accent);}
  .btn.accent:hover{background:var(--accent-d);border-color:var(--accent-d);}
  .btn.sm{padding:6px 12px;font-size:12px;}
  .btn.danger{background:transparent;border-color:var(--line-2);color:var(--accent);}
  .btn.danger:hover{background:var(--accent-soft);border-color:var(--accent);
    color:var(--accent-d);}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .btn:disabled:hover{background:var(--ink);border-color:var(--ink);transform:none;}
  .btn.ghost:disabled:hover{background:transparent;border-color:var(--line-2);}

  /* inputs */
  input[type=text],input[type=date],input[type=number],select{
    border:1px solid var(--line-2);background:var(--surface);
    padding:8px 11px;border-radius:var(--r-sm);
    transition:border-color var(--t),box-shadow var(--t);}
  input:focus,select:focus{outline:none;border-color:var(--ink);
    box-shadow:0 0 0 3px rgba(26,24,20,.08);}
  input:disabled,select:disabled{opacity:.6;background:var(--paper);
    cursor:not-allowed;}
  label.fld{display:block;margin-bottom:14px;}
  label.fld .lab{display:block;font-size:11px;font-weight:600;color:var(--muted);
    margin-bottom:5px;letter-spacing:.08em;text-transform:uppercase;}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;}
  .row > *{flex:1;min-width:130px;}

  /* lock pill */
  .lock-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;
    font-weight:600;color:var(--accent);background:var(--accent-soft);
    padding:3px 9px;border-radius:999px;letter-spacing:.02em;}

  /* list items */
  .list-item{display:flex;align-items:center;gap:10px;padding:7px 8px;
    border-radius:var(--r-sm);transition:background var(--t);margin:0 -8px;}
  .list-item:hover{background:var(--paper);}
  .list-item input[type=text]{flex:1;border-color:transparent;background:transparent;}
  .list-item input[type=text]:hover:not(:disabled){background:var(--surface);
    border-color:var(--line);}
  .list-item input[type=text]:focus{background:var(--surface);border-color:var(--ink);}
  .idx{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    color:var(--muted-2);font-size:12px;width:24px;text-align:right;}
  .x{border:none;background:none;color:var(--muted);cursor:pointer;
    font-size:18px;line-height:1;padding:4px 8px;border-radius:4px;
    transition:color var(--t),background var(--t);}
  .x:hover:not(:disabled){color:var(--accent);background:var(--accent-soft);}
  .x:disabled{opacity:.3;cursor:not-allowed;}

  /* scroll & grid */
  .scroll{overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm);
    -webkit-overflow-scrolling:touch;background:var(--surface);}
  .scroll.tall{max-height:65vh;}
  table.grid{border-collapse:separate;border-spacing:0;background:var(--surface);}
  table.grid th,table.grid td{border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);}
  th.corner{position:sticky;top:0;left:0;z-index:5;background:var(--ink);
    color:var(--paper);font-size:11px;font-weight:600;padding:8px 10px;
    letter-spacing:.04em;}
  th.col{position:sticky;top:0;z-index:4;background:var(--ink);color:var(--paper);
    font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:11px;
    padding:6px 4px;min-width:50px;white-space:nowrap;}
  th.col .wd{display:block;font-size:10px;opacity:.65;font-family:'Archivo';
    font-weight:400;margin-top:2px;}
  th.col.sat{color:#9ac8e8;} th.col.sun{color:#e89c92;}
  td.rh{position:sticky;left:0;z-index:3;background:var(--ink);color:var(--paper);
    font-family:ui-monospace,Menlo,monospace;font-weight:600;font-size:11px;
    padding:0 10px;white-space:nowrap;text-align:right;letter-spacing:.02em;}
  td.cell{width:50px;height:28px;cursor:pointer;background:var(--surface);
    text-align:center;position:relative;transition:background 100ms ease;}
  td.cell:hover{background:var(--paper);}
  td.cell.no{background:var(--accent);}
  td.cell.no:hover{background:var(--accent-d);}
  td.cell .cnt{position:absolute;top:2px;right:3px;font-size:9px;
    color:var(--muted);font-weight:600;}
  td.cell.no .cnt{color:rgba(255,255,255,.75);}
  .grid-touch td.cell{touch-action:auto;}

  /* matrix */
  td.mx{width:48px;height:32px;cursor:pointer;background:var(--surface);
    text-align:center;transition:background 100ms ease;}
  td.mx:hover{background:var(--paper);}
  td.mx .chk{display:inline-block;width:16px;height:16px;border-radius:4px;
    border:1.5px solid var(--line-2);vertical-align:middle;
    transition:background var(--t),border-color var(--t);}
  td.mx.on .chk{background:var(--accent);border-color:var(--accent);
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 16 16' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M3.5 8.5l3 3 6-7' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-position:center;background-repeat:no-repeat;background-size:13px;}
  td.mx.on{background:var(--accent-soft);}
  td.song-h{position:sticky;left:0;z-index:3;background:var(--ink);color:var(--paper);
    font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12px;
    padding:0 12px;white-space:nowrap;}

  /* pills & badges */
  .pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;
    background:var(--paper);color:var(--ink-2);margin:2px 3px 2px 0;
    font-weight:500;border:1px solid var(--line);}
  .pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent;}
  .pill.asg{background:var(--accent);color:#fff;border-color:transparent;
    font-weight:600;}
  .badge{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:12px;}

  /* song result cards */
  .song-res{border:1px solid var(--line);border-radius:var(--r-sm);
    padding:14px 16px;margin-bottom:8px;background:var(--surface);
    transition:border-color var(--t);}
  .song-res:hover{border-color:var(--line-2);}
  .song-res.zero{border-color:rgba(207,61,30,.35);background:var(--warn-soft);}
  .song-res .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    margin-bottom:8px;}
  .song-res .nm{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:15px;}
  .song-res .mem{font-size:12px;color:var(--muted);}
  .song-res .slots{font-size:13px;}
  .daygrp{margin:5px 0;line-height:1.9;}
  .daygrp .dl{font-weight:600;font-size:11px;color:var(--muted);
    letter-spacing:.04em;text-transform:uppercase;margin-right:6px;}
  .zero-msg{color:var(--accent-d);font-weight:600;font-size:13px;}

  /* results grid extras */
  td.cell.assigned{background:var(--accent);}
  td.cell.assigned:hover{background:var(--accent);}
  td.cell.assigned .asg{font-family:'Bricolage Grotesque',sans-serif;
    font-weight:800;font-size:11px;color:#fff;line-height:1;}
  td.cell .okn{display:inline-block;font-size:9.5px;font-weight:600;
    color:var(--ink);line-height:1.1;padding:1px 2px;white-space:nowrap;
    max-width:100%;overflow:hidden;text-overflow:ellipsis;}
  td.cell .nbadge{position:absolute;top:1px;left:3px;font-size:8px;
    font-weight:700;color:var(--muted);}
  /* 주차 탭 */
  .week-tabs{display:inline-flex;flex-wrap:wrap;gap:2px;margin:6px 0 14px;
    padding:4px;background:var(--paper);border-radius:9px;
    border:1px solid var(--line);}
  .week-tab{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;
    font-size:12px;padding:6px 14px;background:transparent;border:none;
    cursor:pointer;color:var(--muted);border-radius:6px;line-height:1.2;
    text-align:center;transition:color var(--t),background var(--t),box-shadow var(--t);}
  .week-tab:hover{color:var(--ink);}
  .week-tab.on{color:var(--ink);background:var(--surface);box-shadow:var(--shadow-sm);}
  .week-tab .wkn{display:block;font-size:10px;color:var(--muted-2);
    font-family:'Archivo';font-weight:400;margin-top:1px;letter-spacing:.02em;}
  .week-tab.on .wkn{color:var(--muted);}

  /* transpose 그리드 — 날짜가 행, 시간이 열 */
  td.rh-date{position:sticky;left:0;z-index:3;background:var(--ink);
    color:var(--paper);font-family:'Bricolage Grotesque',sans-serif;
    font-weight:700;font-size:11px;padding:0 12px;white-space:nowrap;
    text-align:right;min-width:88px;line-height:1.1;}
  td.rh-date .wd{font-size:10px;opacity:.6;font-family:'Archivo';
    font-weight:400;margin-right:5px;}
  td.rh-date.sat{color:#9ac8e8;}
  td.rh-date.sun{color:#e89c92;}
  th.col-time{position:sticky;top:0;z-index:4;background:var(--ink);
    color:var(--paper);font-family:ui-monospace,Menlo,monospace;
    font-weight:600;font-size:10.5px;padding:7px 4px;min-width:50px;
    white-space:nowrap;letter-spacing:.01em;}

  /* 멤버 칩 클릭 가능하게 */
  button.mstat{cursor:pointer;color:var(--ink);font-family:inherit;}
  button.mstat:hover{border-color:var(--ink);}
  button.mstat.done:hover{border-color:var(--ok);}

  /* 간트 그리드 */
  table.gantt th.gnt-corner{position:sticky;top:0;left:0;z-index:6;
    background:var(--ink);color:var(--paper);font-size:11px;font-weight:600;
    padding:8px 10px;letter-spacing:.04em;}
  table.gantt th.gnt-day{position:sticky;top:0;z-index:4;background:var(--ink);
    color:var(--paper);font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:11px;padding:6px 4px;text-align:center;
    border-right:4px solid var(--ink);border-bottom:0;}
  table.gantt th.gnt-day .wd{display:inline-block;font-size:10px;opacity:.65;
    font-family:'Archivo';font-weight:400;margin-left:2px;}
  table.gantt th.gnt-day.sat{color:#9ac8e8;}
  table.gantt th.gnt-day.sun{color:#e89c92;}
  table.gantt th.gnt-sub{background:var(--ink);
    color:var(--paper);font-family:'Bricolage Grotesque',sans-serif;font-weight:600;
    font-size:10.5px;padding:6px 2px 5px;text-align:center;min-width:26px;
    white-space:nowrap;letter-spacing:-.01em;border-bottom:1px solid var(--ink);}
  table.gantt th.gnt-sub::before{content:'';display:block;height:3px;width:100%;
    background:var(--sc,#888);margin-bottom:4px;border-radius:2px;}
  table.gantt th.gnt-sub.day-end{border-right:4px solid var(--ink);}
  table.gantt td.gnt-cell{width:26px;height:30px;cursor:pointer;padding:0;
    border-right:1px solid var(--line);border-bottom:1px solid var(--line);
    transition:filter 80ms ease;}
  table.gantt td.gnt-cell.day-end{border-right:4px solid var(--ink);}
  table.gantt td.gnt-cell.feasible:hover, table.gantt td.gnt-cell.has:hover{filter:brightness(.88);}
  table.gantt td.gnt-cell.infeasible{cursor:not-allowed;
    background:repeating-linear-gradient(135deg, var(--surface) 0 3px,
      rgba(26,24,20,.04) 3px 6px) !important;}
  table.gantt td.gnt-cell.conflict{cursor:not-allowed;
    background-image:repeating-linear-gradient(135deg,
      rgba(255,255,255,.65) 0 3px, transparent 3px 6px);}
  table.gantt td.gnt-cell.preview-outline{outline:2px solid var(--ink);
    outline-offset:-2px;}

  /* 최종 시간표 카드 */
  .fd-title{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;
    font-size:18px;letter-spacing:-.02em;margin-bottom:14px;
    padding:0 2px 12px;border-bottom:1.5px solid var(--line);}
  .fd-title .fd-subtitle{font-weight:500;font-size:13px;color:var(--muted);
    margin-left:4px;letter-spacing:-.005em;}
  .fd-list{display:flex;flex-direction:column;gap:14px;}
  .fd-head{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:14px;letter-spacing:-.01em;margin-bottom:8px;
    color:var(--ink);}
  .fd-head .fd-wd{color:var(--muted);font-weight:500;margin-left:6px;font-size:13px;}
  .fd-blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:8px;}
  .fd-block{border:1px solid var(--line);border-left:4px solid var(--sc,var(--accent));
    border-radius:var(--r-sm);padding:11px 14px;background:var(--surface);
    transition:border-color var(--t),transform var(--t);}
  .fd-block:hover{border-color:var(--line-2);}
  .fd-block .fb-time{font-family:ui-monospace,Menlo,monospace;font-weight:600;
    font-size:12px;color:var(--ink);display:flex;align-items:center;gap:6px;
    margin-bottom:4px;letter-spacing:.01em;}
  .fd-block .fb-dot{width:8px;height:8px;border-radius:50%;
    background:var(--sc,var(--accent));display:inline-block;flex-shrink:0;}
  .fd-block .fb-song{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:14px;color:var(--ink);margin-bottom:5px;letter-spacing:-.01em;}
  .fd-block .fb-mem{font-size:12px;color:var(--muted);line-height:1.4;}
  .fd-block .fb-mem b{color:var(--ink);font-weight:600;}

  /* 곡별 요약 */
  .fs-card{border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--surface);padding:14px 16px;margin-bottom:14px;}
  .fs-head{display:flex;justify-content:space-between;align-items:baseline;
    margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  .fs-h-label{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:14px;letter-spacing:-.01em;color:var(--ink);}
  .fs-h-total{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:13px;color:var(--accent);letter-spacing:-.01em;}
  .fs-list-wrap{display:flex;flex-direction:column;gap:7px;}
  .fs-row{display:grid;grid-template-columns:14px minmax(80px,auto) auto 1fr;
    align-items:baseline;gap:10px;font-size:12.5px;line-height:1.5;}
  .fs-dot{width:8px;height:8px;border-radius:50%;background:var(--sc);
    align-self:center;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.05);}
  .fs-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;
    font-size:13.5px;color:var(--ink);letter-spacing:-.005em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fs-count{font-size:12px;color:var(--accent);font-weight:600;
    background:var(--accent-soft);padding:1px 8px;border-radius:999px;
    white-space:nowrap;}
  .fs-list{font-size:12px;color:var(--muted);
    display:flex;flex-wrap:wrap;gap:4px 10px;}
  .fs-sess{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;}
  @media (max-width:640px){
    .fs-row{grid-template-columns:14px 1fr auto;}
    .fs-list{grid-column:1 / -1;padding-left:24px;}
  }

  /* 캘린더 뷰 */
  .cal{border:1px solid var(--line);border-radius:var(--r-sm);
    background:var(--surface);overflow:hidden;}
  .cal-row{display:flex;}
  .cal-corner{flex:0 0 56px;background:var(--ink);height:32px;}
  .cal-head-days{flex:1;display:flex;}
  .cal-head-row .cal-day-head{flex:1;background:var(--ink);color:var(--paper);
    text-align:center;padding:7px 4px 6px;font-family:'Bricolage Grotesque',sans-serif;
    font-size:11px;font-weight:700;border-right:1px solid #000;height:32px;
    box-sizing:border-box;display:flex;align-items:center;justify-content:center;
    gap:4px;}
  .cal-head-row .cal-day-head:last-child{border-right:0;}

function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

const itemName=v=>typeof v==='string'?v:(v&&v.name)||'';
const itemTs  =v=>(v&&typeof v==='object'&&typeof v.ts==='number')?v.ts:0;
function sortedIds(map){
  return Object.keys(map||{}).sort((a,b)=>{
    const ta=itemTs(map[a]), tb=itemTs(map[b]);
    if(ta!==tb) return ta-tb;
    return a<b?-1:a>b?1:0;
  });
}

/* 곡별 색상 — 등록 순서에 따라 hue 분산 */

  return sortedIds(state.config?.songs||{}).filter(s=>songMembers(s).length>0);

function songColor(sid){
  const arr=_activeSongOrder();
  const idx=arr.indexOf(sid);
  if(idx<0) return 'hsl(8,70%,48%)';
  const hue=Math.round((idx/Math.max(arr.length,1))*360);
  return `hsl(${hue},65%,46%)`;
}
function songColorLight(sid){
  const arr=_activeSongOrder();
  const idx=arr.indexOf(sid);
  if(idx<0) return 'rgba(0,0,0,.06)';
  const hue=Math.round((idx/Math.max(arr.length,1))*360);
  return `hsl(${hue},75%,90%)`;

function normalizeSchedule(raw){
  if(!raw||typeof raw!=='object') return {};
  const isOld=Object.keys(raw).some(k=>/^\d{4}-\d{2}-\d{2}\|/.test(k));
  if(!isOld) return raw;
  const out={};
  for(const k in raw){
    const sid=raw[k];
    if(typeof sid!=='string') continue;
    (out[sid]=out[sid]||{})[k]=true;
  }
  return out;
}
function isAssigned(sid,slotKey){

  const mine=new Set(songMembers(sid));

    if(other===sid) continue;
    if(!state.schedule[other][slotKey]) continue;
    const shared=songMembers(other).filter(u=>mine.has(u));
    if(shared.length) out.push({sid:other,shared});

/* ---- 시간 산수 + 블록 통합 ---- */
function parseTime(t){const [h,m]=t.split(':').map(Number);return h*60+(m||0);}
function fmtTime(min){
  const h=Math.floor(min/60), mm=min%60;
  return String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');
}
function fmtDur(min){
  const h=Math.floor(min/60), m=min%60;
  if(h===0) return `${m}분`;
  if(m===0) return `${h}시간`;
  return `${h}시간 ${m}분`;
}
function consolidateBlocks(filterUid){
  // 연속된 같은 곡의 슬롯들을 하나의 블록으로 합침
  const c=state.config; if(!c) return [];
  const sm=c.slotMinutes||60;
  const blocks=[];
  for(const sid in state.schedule){
    if(!c.songs[sid]) continue;
    const members=songMembers(sid);
    if(filterUid && !members.includes(filterUid)) continue;
    const slotMap=state.schedule[sid]||{};
    const slots=Object.keys(slotMap).filter(k=>slotMap[k]);
    const byDate={};
    slots.forEach(k=>{
      const [d,t]=k.split('|');
      (byDate[d]=byDate[d]||[]).push(t);
    });
    for(const date in byDate){
      const times=byDate[date].slice().sort();
      let runStart=null, prev=null;
      times.forEach(t=>{
        if(runStart===null){ runStart=t; prev=t; return; }
        if(parseTime(t)-parseTime(prev)===sm){ prev=t; return; }
        blocks.push({sid,date,start:runStart,end:fmtTime(parseTime(prev)+sm),members});
        runStart=t; prev=t;
      });
      if(runStart!==null)
        blocks.push({sid,date,start:runStart,end:fmtTime(parseTime(prev)+sm),members});
    }
  }
  blocks.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start));
  return blocks;
}

/* ---- 주 단위 그리드 (월~일) ---- */
function weekStart(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const dow=d.getDay();          // 0=일, 1=월, …, 6=토
  const off=(dow+6)%7;           // 월=0, 화=1, …, 일=6
  d.setDate(d.getDate()-off);
  return d;
}
function buildWeeks(dates){
  if(!dates.length) return [];
  const inSet=new Set(dates);
  const first=weekStart(dates[0]);
  const last=new Date(dates[dates.length-1]+'T00:00:00');
  const out=[];
  let cur=new Date(first);
  let guard=0;
  while(cur<=last && guard<60){
    const days=[];
    for(let i=0;i<7;i++){
      const ds=fmtDate(cur);
      days.push({date:ds, inRange:inSet.has(ds)});
      cur.setDate(cur.getDate()+1);
    }
    out.push(days); guard++;
  }
  return out;
}

/* ---------------- Firebase ---------------- */
async function initFirebase(){
  if(String(firebaseConfig.apiKey).includes('PASTE')) return 'no-config';
  try{
    const a=await import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-app.js`);
    const d=await import(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-database.js`);
    const app=a.initializeApp(firebaseConfig);
    DB=d.getDatabase(app);
    FB={ref:d.ref,onValue:d.onValue,set:d.set,get:d.get,update:d.update,remove:d.remove};
    fbReady=true; return 'ok';
  }catch(e){ console.error('Firebase load failed',e); return 'error'; }
}
const R=p=>FB.ref(DB,p);

function subscribeIndex(){
  FB.onValue(R('projectIndex'),s=>{ state.index=s.val()||{};
    if(state.screen==='landing') render(); });
}
function subscribeProject(pid){
  FB.onValue(R('projects/'+pid+'/config'),s=>{ state.config=s.val();
    if(state.screen==='project') render(); });
  FB.onValue(R('projects/'+pid+'/avail'),s=>{ state.avail=s.val()||{};
    if(state.screen==='project') render(); });
  FB.onValue(R('projects/'+pid+'/schedule'),s=>{ state.schedule=normalizeSchedule(s.val());
    if(state.screen==='project') render(); });
  FB.onValue(R('projects/'+pid+'/done'),s=>{ state.done=s.val()||{};
    if(state.screen==='project') render(); });
}

/* ---- 내보내기 ---- */
async function ensureH2c(){
  if(window.html2canvas) return window.html2canvas;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
  return window.html2canvas;
}
async function exportPNG(){
  const el=document.getElementById('final-snapshot');
  if(!el){ toast('저장할 내용이 없습니다'); return; }
  toast('PNG 생성 중...');
  try{
    const h2c=await ensureH2c();
    const canvas=await h2c(el,{backgroundColor:'#fffdf7',scale:2});
    const c=state.config;
    const who=state.finalFilter ? itemName(c.people[state.finalFilter]) : 'all';
    const link=document.createElement('a');
    link.download=`${(c.name||'schedule').replace(/[\\/:*?"<>|]/g,'_')}-${who}.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
  }catch(e){ console.error(e); toast('PNG 저장 실패'); }
}
function escapeICS(s){
  return String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\r?\n/g,'\\n');
}
function exportICS(){
  const c=state.config; if(!c) return;
  const blocks=consolidateBlocks(state.finalFilter||null);
  if(!blocks.length){ toast('배정된 시간표가 없습니다'); return; }
  const pad=n=>String(n).padStart(2,'0');
  const now=new Date();
  const dtstamp=`${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//talmood//timetable//KO','CALSCALE:GREGORIAN'];
  blocks.forEach(b=>{
    const dstart=b.date.replace(/-/g,'')+'T'+b.start.replace(':','')+'00';
    const dend=b.date.replace(/-/g,'')+'T'+b.end.replace(':','')+'00';
    const songNm=itemName(c.songs[b.sid]);
    const memNm=b.members.map(u=>itemName(c.people[u])).join(', ');
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${state.pid}-${b.sid}-${b.date}-${b.start.replace(':','')}@talmood.app`);
    lines.push(`DTSTAMP:${dtstamp}`);
    lines.push(`DTSTART:${dstart}`);
    lines.push(`DTEND:${dend}`);
    lines.push(`SUMMARY:합주 · ${escapeICS(songNm)}`);
    lines.push(`DESCRIPTION:${escapeICS('멤버: '+memNm)}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const ics=lines.join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const who=state.finalFilter?itemName(c.people[state.finalFilter]):'all';
  const link=document.createElement('a');
  link.href=url;
  link.download=`${(c.name||'schedule').replace(/[\\/:*?"<>|]/g,'_')}-${who}.ics`;
  link.click();
  URL.revokeObjectURL(url);
  toast('캘린더 파일을 받았습니다');
}

async function loadPreset(){
  if(!confirm('밴드 기본 구성(10곡·14명·담당표)을 불러옵니다.\n기존 곡/사람 목록을 덮어쓸까요?'))return;
  const songs={},people={},matrix={},nameToUid={};
  const base=Date.now();
  PRESET.songs.forEach((n,i)=>{songs[genId('s')]={name:n,ts:base+i};});
  PRESET.people.forEach((n,i)=>{const id=genId('u');people[id]={name:n,ts:base+i};nameToUid[n]=id;});
  const songByName={};for(const id in songs)songByName[songs[id].name]=id;
  for(const sn in PRESET.matrix){
    const sid=songByName[sn];matrix[sid]={};
    PRESET.matrix[sn].forEach(pn=>{matrix[sid][nameToUid[pn]]=true;});
  }
  await FB.update(R('projects/'+state.pid+'/config'),{songs,people,matrix});
  toast('기본 구성을 불러왔습니다');
}

/* ---------------- 계산 ---------------- */
function songMembers(sid){
  const m=state.config.matrix?.[sid]||{};
  return Object.keys(m).filter(u=>m[u]&&state.config.people?.[u]);
}
function slotOkForSong(sid,key){
  return songMembers(sid).every(u=>!(state.avail[u]&&state.avail[u][key]));
}
function unavailCount(key){
  let n=0;for(const u in state.avail) if(state.avail[u][key]) n++;return n;
}
function shortName(s){
  if(!s) return '';
  return /[가-힣]/.test(s) ? s.slice(0,2) : s.slice(0,3);
}

/* ---------------- 렌더 ---------------- */
let deferRender=false, painting=false, gPainting=false;
function render(){
  const a=document.activeElement;
  if(painting||gPainting){deferRender=true;return;}
  if(a&&a.tagName==='INPUT'&&a.type==='text'&&$('app').contains(a)){
    deferRender=true;return;}
  doRender();
}
function doRender(){
  const scrolls=[...$('app').querySelectorAll('.scroll')]
    .map(sc=>({sl:sc.scrollLeft,st:sc.scrollTop}));
  const ws=window.scrollY||window.pageYOffset||0;
  renderHeader(); renderBody();
  const newScrolls=[...$('app').querySelectorAll('.scroll')];
  newScrolls.forEach((sc,i)=>{
    const s=scrolls[i]; if(!s) return;
    sc.scrollLeft=s.sl; sc.scrollTop=s.st;
  });
  window.scrollTo(0,ws);
}

function renderHeader(){
  let h='<div class="brand" data-act="home">합주<span class="dot">.</span>조율</div>';
  if(state.screen==='project'&&state.config){
    h+='<div class="crumb">'
      +'<span class="pname">'+esc(state.config.name||'(이름 없음)')+'</span>'
      +'<button class="code-chip" data-act="copycode" title="코드 복사">'
      +'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="8" height="9" rx="1.2"/><path d="M3 11V3.5A1 1 0 014 2.5h7"/></svg>'
      +state.pid+'</button></div>';
    h+='<div class="tabs">';
    [['setup','설정'],['participate','입력'],['results','결과'],['detail','상세']].forEach(([k,l])=>{
      h+='<button class="tab '+(state.tab===k?'on':'')+'" data-act="tab" data-tab="'+k+'">'+l+'</button>';
    });
    h+='</div>';
  }
  $('hbar').innerHTML=h;
}

function renderBody(){
  const app=$('app');
  if(state.screen==='loading'){ app.innerHTML='<div class="empty">불러오는 중…</div>'; return; }
  if(state.screen==='no-config'){ app.innerHTML=viewNoConfig(); return; }
  if(state.screen==='fb-error'){ app.innerHTML=viewFbError(); return; }
  if(state.screen==='landing'){ app.innerHTML=viewLanding(); return; }
  if(state.screen==='project'){
    if(!state.config){ app.innerHTML=viewMissing(); return; }
    if(state.tab==='setup') app.innerHTML=viewSetup();
    else if(state.tab==='participate') app.innerHTML=viewParticipate();
    else if(state.tab==='detail') app.innerHTML=viewResultsDetail();
    else app.innerHTML=viewResults();
  }
}

          <option value="30" ${c.slotMinutes==30?'selected':''}>30분</option>
        </select></label>
    </div>

  <div class="card">
    <div class="card-head">
      <div class="section-label" style="margin:0">곡 목록 <span class="count">${sIds.length}</span></div>
      <div style="display:flex;gap:6px">
        ${(!sIds.length&&!pIds.length)?`<button class="btn ghost sm" data-act="preset" ${dis}>기본 구성 불러오기</button>`:''}
        <button class="btn sm" data-act="addsong" ${dis}>+ 곡 추가</button>
      </div>
    </div>
    ${songRows}
  </div>
  <div class="card">
    <div class="card-head">
      <div class="section-label" style="margin:0">멤버 목록 <span class="count">${pIds.length}</span></div>
      <button class="btn sm" data-act="addperson" ${dis}>+ 멤버 추가</button>
    </div>
    ${pplRows}
  </div>
  <div class="card">
    <div class="section-label">담당표 — 곡 × 멤버</div>
    ${matrix}
  </div>
  <div class="card danger-zone">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <div class="section-label" style="margin:0 0 4px;color:var(--accent)">위험 구역</div>
        <div style="font-size:13px;color:var(--muted)">프로젝트를 영구 삭제합니다. 되돌릴 수 없습니다.</div>
      </div>
      <button class="btn danger sm" data-act="delproject">프로젝트 삭제</button>
    </div>
  </div>`;
}

function viewParticipate(){
  const c=state.config;
  const pIds=sortedIds(c.people||{});
  if(!pIds.length) return `<div class="card"><div class="empty">설정 화면에서 멤버를 먼저 추가하세요.</div></div>`;
  if(state.me&&!c.people[state.me]) state.me=null;

  let opts='<option value="">— 이름 선택 —</option>'+
    pIds.map(u=>`<option value="${u}" ${state.me===u?'selected':''}>${esc(itemName(c.people[u]))}</option>`).join('');

  const statusChips=pIds.map(u=>{
    const n=state.avail[u]?Object.keys(state.avail[u]).length:0;
    const isMe=u===state.me;
    const isDone=!!state.done[u];
    const cls=isDone?'done':(n>0?'pending':'');
    const title=isDone
      ? `작성 완료 · ${n}칸 표시 · 클릭하면 이 사람 일정으로 이동`
      : (n>0?`작성 중 · ${n}칸 표시 · 클릭하면 이 사람 일정으로 이동`
            :'미입력 · 클릭하면 이 사람 일정으로 이동');
    const check=isDone?'<span class="check">✓</span>':'<span class="dot"></span>';
    const ct=isDone?'<span class="ct">완료</span>':(n>0?`<span class="ct">${n}</span>`:'');
    return `<button class="mstat ${cls} ${isMe?'me':''}" data-act="pickmember" data-uid="${u}" title="${title}">
      ${check}${esc(itemName(c.people[u]))}${ct}</button>`;
  }).join('');
  const doneCount=pIds.filter(u=>!!state.done[u]).length;

  let head=`<div class="card">
    <div class="card-head">
      <div>
        <h2>안 되는 시간 입력</h2>
        <div class="sub" style="margin:4px 0 0">본인 이름을 고르고, 합주가 <b style="color:var(--accent)">불가능한 칸</b>을 칠하세요. PC는 박스 드래그로 여러 칸 한 번에 선택 가능.</div>
      </div>
    </div>
    <label class="fld" style="max-width:280px;margin-bottom:0">
      <span class="lab">내 이름</span>
      <select data-act="pickme" style="width:100%">${opts}</select>
    </label>
    <div class="section-label" style="margin:18px 0 0">멤버 현황 <span class="count">${doneCount}/${pIds.length}</span></div>
    <div class="member-status">${statusChips}</div>
  </div>`;

  if(!state.me) return head+`<div class="card"><div class="empty">이름을 선택하면 시간표가 나타납니다.</div></div>`;

  const dates=dateList(c.startDate,c.endDate);
  const times=timeList(c.startHour,c.endHour,c.slotMinutes);
  if(!dates.length||!times.length)
    return head+`<div class="card"><div class="empty">설정에서 날짜·시간 범위를 확인하세요.</div></div>`;

  const mine=state.avail[state.me]||{};
  const myCount=Object.keys(mine).length;
  const wks=buildWeeks(dates).map((w,i)=>{
    const range=w.filter(d=>d.inRange).map(d=>d.date);
    return {idx:i, dates:w, range};
  }).filter(w=>w.range.length>0);
  const activeIdx=Math.min(Math.max(state.activeWeek||0,0), wks.length-1);
  const active=wks[activeIdx]||null;
  const tabsHtml=wks.length>1?`<div class="week-tabs">
    ${wks.map((w,i)=>{
      const rng=w.range.length>1
        ?`${mdLabel(w.range[0])} ~ ${mdLabel(w.range[w.range.length-1])}`
        :mdLabel(w.range[0]);
      return `<button class="week-tab ${i===activeIdx?'on':''}" data-act="pickweek" data-w="${i}">
        ${w.idx+1}주차<span class="wkn">${rng}</span></button>`;
    }).join('')}
  </div>`:'';

  let gridHtml='';
  if(active){
    const WD_MON=['월','화','수','목','금','토','일'];
    let head2='<th class="corner">시간</th>'+active.dates.map((day,di)=>{
      const isSat=di===5,isSun=di===6;
      const cls='col '+(isSat?'sat':'')+(isSun?'sun':'')+(day.inRange?'':' out');
      return `<th class="${cls}">${mdLabel(day.date)}<span class="wd">${WD_MON[di]}</span></th>`;
    }).join('');
    let rows=times.map((t,ri)=>{
      const cells=active.dates.map((day,ci)=>{
        if(!day.inRange) return `<td class="cell out"></td>`;
        const k=slotKey(day.date,t);
        const no=!!mine[k];
        const others=unavailCount(k)-(no?1:0);
        return `<td class="cell ${no?'no':''}" data-cell="1" data-slot="${k}" data-r="${ri}" data-c="${ci}">
          ${others>0?`<span class="cnt">${others}</span>`:''}</td>`;
      }).join('');
      return `<tr><td class="rh">${t}</td>${cells}</tr>`;
    }).join('');
    gridHtml=`<div class="scroll grid-touch"><table class="grid">
      <thead><tr>${head2}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  const meDone=!!state.done[state.me];
  return head+`<div class="card">
    <div class="card-head" style="margin-bottom:10px">
      <h2 style="font-size:15px">${esc(itemName(c.people[state.me]))} 님의 일정</h2>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="badge" style="color:${myCount?'var(--accent)':'var(--muted)'}">표시한 시간 ${myCount}칸</span>
        <button class="btn-done ${meDone?'on':''}" data-act="toggledone">
          <span class="check">${meDone?'✓':''}</span>
          ${meDone?'작성 완료됨':'작성 완료 체크'}
        </button>
      </div>
    </div>
    ${tabsHtml}
    ${gridHtml || '<div class="empty">날짜 범위를 설정에서 확인하세요.</div>'}
    <div class="note">빨간 칸 = 내가 안 되는 시간. 칸 모서리의 숫자 = 같은 시간에 안 되는 다른 멤버 수. PC에서는 박스 드래그로 여러 칸 한 번에 선택할 수 있습니다. 다 입력했으면 우상단의 <b>작성 완료 체크</b>를 눌러주세요.</div>
  </div>`;
}

function viewResults(){
  const c=state.config;
  const sIds=sortedIds(c.songs||{});
  if(!sIds.length) return `<div class="card"><div class="empty">설정에서 곡을 추가하세요.</div></div>`;
  const dates=dateList(c.startDate,c.endDate);
  const times=timeList(c.startHour,c.endHour,c.slotMinutes);

  const activeSongs=sIds.filter(s=>songMembers(s).length>0);
  const schedule=state.schedule||{};
  const hidden=state.hiddenSongs||{};
  const isShown=sid=>!hidden[sid];

  // 곡 토글 — chip style
  const allShown=activeSongs.every(isShown);
  let toggleHtml=`<div class="song-toggles">
    <span class="label">표시:</span>
    <button class="btn ghost sm" data-act="toggleall" style="padding:3px 11px;font-size:11px;border-radius:999px">${allShown?'모두 숨기기':'모두 보기'}</button>
    ${activeSongs.map(s=>{
      const on=isShown(s);
      const col=songColor(s);
      const sty=on?`background:${col};border-color:${col};color:#fff`:'';
      return `<label class="chip-toggle ${on?'on':''}" style="${sty}">
        <input type="checkbox" data-act="togglesong" data-sid="${s}" ${on?'checked':''}>
        <span class="csw" style="background:${col}"></span>${esc(itemName(c.songs[s]))}
      </label>`;}).join('')}
  </div>`;

  // 표시할 곡 (활성 + 안 숨김)
  const visibleSongs=activeSongs.filter(isShown);

  const wks=buildWeeks(dates).map((w,i)=>{
    const range=w.filter(d=>d.inRange).map(d=>d.date);
    return {idx:i, dates:w, range};
  }).filter(w=>w.range.length>0);
  const activeIdx=Math.min(Math.max(state.activeWeek||0,0), wks.length-1);
  const active=wks[activeIdx]||null;
  const tabsHtml=wks.length>1?`<div class="week-tabs">
    ${wks.map((w,i)=>{
      const rng=w.range.length>1
        ?`${mdLabel(w.range[0])} ~ ${mdLabel(w.range[w.range.length-1])}`
        :mdLabel(w.range[0]);
      return `<button class="week-tab ${i===activeIdx?'on':''}" data-act="pickweek" data-w="${i}">
        ${w.idx+1}주차<span class="wkn">${rng}</span></button>`;
    }).join('')}
  </div>`:'';

  function ganttCell(sid, k, ri, di, si, isDayEnd){
    const assigned=isAssigned(sid,k);
    const feasible=slotOkForSong(sid,k);
    const cfs=(feasible && !assigned)?slotConflicts(sid,k):[];
    let cls='gnt-cell'+(isDayEnd?' day-end':'');
    let style='';
    let title='';
    if(assigned){
      cls+=' has';
      style=`background:${songColor(sid)}`;
      title=`${itemName(c.songs[sid])} 배정 · 클릭하면 해제`;
    } else if(!feasible){
      cls+=' infeasible';
      title='이 시간엔 멤버가 안 됩니다';
    } else if(cfs.length){
      cls+=' conflict';
      const nm=cfs.map(x=>itemName(c.songs[x.sid])).join(', ');
      title=`멤버 겹침: ${nm}`;
    } else {
      cls+=' feasible';
      style=`background:${songColorLight(sid)}`;
      title=`${itemName(c.songs[sid])} 클릭하면 배정`;
    }
    return `<td class="${cls}" data-gantt="1" data-sid="${sid}" data-slot="${k}" data-r="${ri}" data-col="${di}-${si}" title="${esc(title)}"${style?` style="${style}"`:''}></td>`;
  }

  function renderGantt(week){
    const days=week.filter(d=>d.inRange);
    if(!days.length) return '<div class="empty">표시할 날짜가 없습니다.</div>';
    if(!visibleSongs.length) return '<div class="empty">표시할 곡을 위에서 체크하세요.</div>';
    const N=visibleSongs.length;
    let dayHead='<th class="gnt-corner" rowspan="2">시간</th>';
    let subHead='';
    days.forEach(day=>{
      const w=wdOf(day.date);
      const wdCls=w===0?'sun':(w===6?'sat':'');
      dayHead+=`<th class="gnt-day ${wdCls}" colspan="${N}">
        ${mdLabel(day.date)} <span class="wd">${WD[w]}</span></th>`;
      visibleSongs.forEach((sid,si)=>{
        const last=si===N-1?'day-end':'';
        subHead+=`<th class="gnt-sub ${last}" style="--sc:${songColor(sid)}" title="${esc(itemName(c.songs[sid]))}">${esc(shortName(itemName(c.songs[sid])))}</th>`;
      });
    });
    let rows=times.map((t,ri)=>{
      let cells='';
      days.forEach((day,di)=>{
        visibleSongs.forEach((sid,si)=>{
          const k=slotKey(day.date,t);
          cells+=ganttCell(sid,k,ri,di,si,si===N-1);
        });
      });
      return `<tr><td class="rh">${t}</td>${cells}</tr>`;
    }).join('');
    return `<div class="scroll grid-touch"><table class="grid gantt">
      <thead><tr>${dayHead}</tr><tr>${subHead}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  const ganttHtml = active ? renderGantt(active.dates) : '<div class="empty">날짜 범위를 설정에서 확인하세요.</div>';

  const gridCard=(dates.length&&times.length)
    ? `<div class="card">
        <h2>시간표 — 가능 시간 & 배정</h2>
        <div class="sub">각 날짜가 곡별 sub-col로 나뉘어 있습니다. <b>옅은 색</b> = 가능한 시간, <b>짙은 색</b> = 실제 배정, 빗금 = 멤버 안 됨, 흰빗금 = 다른 곡과 멤버 겹침. <b>칸을 클릭/드래그</b>하면 직접 배정·해제됩니다.</div>
        ${tabsHtml}
        ${toggleHtml}
        ${ganttHtml}
      </div>`
    : `<div class="card"><div class="note">날짜·시간 범위를 설정하세요.</div></div>`;

  // 최종 시간표 (캘린더 뷰)
  const pIds=sortedIds(c.people||{});
  const filterUid=state.finalFilter&&c.people[state.finalFilter]?state.finalFilter:'';
  const blocks=consolidateBlocks(filterUid||null);
  const memberOpts='<option value="">전체 보기</option>'+
    pIds.map(u=>`<option value="${u}" ${filterUid===u?'selected':''}>${esc(itemName(c.people[u]))}</option>`).join('');

  // 겹치는 블록 → column 분배
  function layoutDayBlocks(arr){
    const sorted=arr.slice().sort((a,b)=>parseTime(a.start)-parseTime(b.start));
    const colEnd=[];
    sorted.forEach(b=>{
      const sm=parseTime(b.start);
      let col=-1;
      for(let i=0;i<colEnd.length;i++) if(colEnd[i]<=sm){col=i;break;}
      if(col===-1){col=colEnd.length;colEnd.push(0);}
      colEnd[col]=parseTime(b.end);
      b._col=col;
    });
    const total=colEnd.length;
    sorted.forEach(b=>b._cols=total);
    return sorted;
  }

  function renderCalWeek(week){
    const sm=c.slotMinutes||60;
    const cellH=36;
    const baseMin=parseTime(times[0]);
    const totalH=times.length*cellH;
    const dateSet=new Set(week.filter(d=>d.inRange).map(d=>d.date));
    const wkBlocks=blocks.filter(b=>dateSet.has(b.date));
    const byD={};
    wkBlocks.forEach(b=>{(byD[b.date]=byD[b.date]||[]).push(b);});
    Object.keys(byD).forEach(d=>{byD[d]=layoutDayBlocks(byD[d]);});

    const timeCells=times.map(t=>`<div class="cal-time" style="height:${cellH}px">${t}</div>`).join('');

    const daysHtml=week.map(d=>{
      const w=wdOf(d.date);
      const wdLabel=['일','월','화','수','목','금','토'][w];
      const wdCls=w===0?'sun':(w===6?'sat':'');
      const outCls=d.inRange?'':'out';
      let bg='';
      for(let i=0;i<times.length;i++) bg+=`<div class="cal-cell" style="height:${cellH}px"></div>`;
      const dayBlocks=byD[d.date]||[];
      const blocksHtml=dayBlocks.map(b=>{
        const sMin=parseTime(b.start), eMin=parseTime(b.end);
        const top=((sMin-baseMin)/sm)*cellH;
        const h=((eMin-sMin)/sm)*cellH-2;
        const leftPct=(b._col/b._cols)*100;
        const wPct=(1/b._cols)*100;
        const songNm=itemName(c.songs[b.sid]);
        const memList=b.members.map(u=>{
          const nm=esc(itemName(c.people[u]));
          return filterUid&&u===filterUid?`<b>${nm}</b>`:nm;
        }).join(' · ');
        const tall=h>50;
        return `<div class="cal-block" style="background:${songColor(b.sid)};top:${top}px;height:${h}px;left:calc(${leftPct.toFixed(2)}% + 1px);width:calc(${wPct.toFixed(2)}% - 2px)" title="${esc(songNm+' · '+b.start+'-'+b.end)}">
          <div class="cb-name">${esc(songNm)}</div>
          <div class="cb-time">${b.start} – ${b.end}</div>
          ${tall?`<div class="cb-mem">${memList}</div>`:''}
        </div>`;
      }).join('');
      return `<div class="cal-day ${wdCls} ${outCls}">
        <div class="cal-day-body" style="height:${totalH}px">${bg}${blocksHtml}</div>
      </div>`;
    }).join('');

    return `<div class="cal">
      <div class="cal-row cal-head-row">
        <div class="cal-corner"></div>
        <div class="cal-days cal-head-days">
          ${week.map(d=>{
            const w=wdOf(d.date);
            const wdLabel=['일','월','화','수','목','금','토'][w];
            const wdCls=w===0?'sun':(w===6?'sat':'');
            const outCls=d.inRange?'':'out';
            return `<div class="cal-day-head ${wdCls} ${outCls}">${d.inRange?mdLabel(d.date):''} <span>${d.inRange?wdLabel:''}</span></div>`;
          }).join('')}
        </div>
      </div>
      <div class="cal-row cal-body-row">
        <div class="cal-time-col">${timeCells}</div>
        <div class="cal-days">${daysHtml}</div>
      </div>
    </div>`;
  }

  // 주차별 캘린더 (active week만 보여줘 한 화면에 부담 없게)
  const wksAll=buildWeeks(dates).map((w,i)=>{
    const range=w.filter(dd=>dd.inRange).map(dd=>dd.date);
    return {idx:i,dates:w,range};
  }).filter(w=>w.range.length>0);
  const activeWk=wksAll[Math.min(Math.max(state.activeWeek||0,0), wksAll.length-1)]||null;
  const finalTabsHtml=wksAll.length>1?`<div class="week-tabs">
    ${wksAll.map((w,i)=>{
      const rng=w.range.length>1
        ?`${mdLabel(w.range[0])} ~ ${mdLabel(w.range[w.range.length-1])}`
        :mdLabel(w.range[0]);
      const on=activeWk&&activeWk.idx===w.idx;
      return `<button class="week-tab ${on?'on':''}" data-act="pickweek" data-w="${i}">
        ${w.idx+1}주차<span class="wkn">${rng}</span></button>`;
    }).join('')}
  </div>`:'';

  const calHtml=activeWk?renderCalWeek(activeWk.dates):'';
  const filterLabel=filterUid?`${esc(itemName(c.people[filterUid]))} 님의 일정`:'전체 합주 일정';

  // 곡별 요약
  const sumBySid={};
  blocks.forEach(b=>{
    const dur=parseTime(b.end)-parseTime(b.start);
    const e=sumBySid[b.sid]||{count:0,minutes:0,list:[]};
    e.count++; e.minutes+=dur; e.list.push(b);
    sumBySid[b.sid]=e;
  });
  const songOrder=sortedIds(c.songs||{});
  const summaryRows=songOrder
    .filter(sid=>sumBySid[sid])
    .map(sid=>{
      const e=sumBySid[sid];
      const songNm=itemName(c.songs[sid]);
      const sessionList=e.list
        .slice().sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start))
        .map(b=>{
          const wd=['일','월','화','수','목','금','토'][wdOf(b.date)];
          return `<span class="fs-sess">${mdLabel(b.date)}(${wd}) ${b.start}–${b.end}</span>`;
        }).join('');
      return `<div class="fs-row" style="--sc:${songColor(sid)}">
        <span class="fs-dot"></span>
        <span class="fs-name">${esc(songNm)}</span>
        <span class="fs-count">${e.count}회 · ${fmtDur(e.minutes)}</span>
        <span class="fs-list">${sessionList}</span>
      </div>`;
    }).join('');
  const totalMin=blocks.reduce((s,b)=>s+(parseTime(b.end)-parseTime(b.start)),0);
  const summaryHtml=blocks.length?`<div class="fs-card">
    <div class="fs-head">
      <span class="fs-h-label">곡별 합주 요약</span>
      <span class="fs-h-total">총 ${blocks.length}회 · ${fmtDur(totalMin)}</span>
    </div>
    <div class="fs-list-wrap">${summaryRows}</div>
  </div>`:'';

  const finalCard=`<div class="card">
    <div class="card-head">
      <div>
        <h2>최종 시간표</h2>
        <div class="sub" style="margin:4px 0 0">배정된 합주를 캘린더 형태로 표시합니다. 멤버 필터를 걸면 그 사람의 일정만 봅니다.</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <select data-act="filtermember">${memberOpts}</select>
        <button class="btn ghost sm" data-act="exportpng" ${blocks.length?'':'disabled'}>📷 PNG</button>
        <button class="btn ghost sm" data-act="exportics" ${blocks.length?'':'disabled'}>📅 .ics</button>
      </div>
    </div>
    ${finalTabsHtml}
    <div id="final-snapshot">
      <div class="fd-title">${esc(c.name||'합주 일정')} <span class="fd-subtitle">· ${filterLabel}</span></div>
      ${summaryHtml}
      ${blocks.length
        ? calHtml
        : `<div class="empty" style="padding:30px 12px">아직 배정된 시간표가 없습니다. 위 그리드에서 칸을 클릭해 배정해 보세요.</div>`}
    </div>
  </div>`;

  return gridCard + finalCard;
}

/* ---- 상세 탭: 곡별 멤버 가능 캘린더 ---- */
function viewResultsDetail(){
  const c=state.config;
  if(!c) return '<div class="card"><div class="empty">프로젝트를 먼저 만드세요.</div></div>';
  const sIds=sortedIds(c.songs||{});
  const activeSongs=sIds.filter(s=>songMembers(s).length>0);
  if(!activeSongs.length){
    return `<div class="card"><div class="empty">담당표에서 멤버가 지정된 곡이 없습니다.</div></div>`;
  }

  let selSid=state.detailSong;
  if(!selSid || !activeSongs.includes(selSid)) selSid=activeSongs[0];

  // 곡 선택 칩 (single-select)
  const songChips=activeSongs.map(s=>{
    const on=s===selSid;
    const col=songColor(s);
    const sty=on?`background:${col};border-color:${col};color:#fff`:'';
    return `<button class="tool-chip ${on?'on':''}" data-act="pickdetailsong" data-sid="${s}" style="${sty}">
      <span class="csw" style="background:${col}"></span>${esc(itemName(c.songs[s]))}
    </button>`;
  }).join('');

  const dates=dateList(c.startDate,c.endDate);
  const times=timeList(c.startHour,c.endHour,c.slotMinutes);
  const members=songMembers(selSid);
  const songNm=itemName(c.songs[selSid]);

  // 통계: 곡 단위 가능 비율
  const totalSlots=dates.length*times.length;
  let feasibleCount=0;
  dates.forEach(d=>times.forEach(t=>{ if(slotOkForSong(selSid, slotKey(d,t))) feasibleCount++; }));
  const memberStats=members.map(u=>{
    const av=state.avail[u]||{};
    let busy=0;
    dates.forEach(d=>times.forEach(t=>{ if(av[slotKey(d,t)]) busy++; }));
    return {uid:u, busy};
  }).sort((a,b)=>b.busy-a.busy);

  // 주차 탭
  const wks=buildWeeks(dates).map((w,i)=>{
    const range=w.filter(d=>d.inRange).map(d=>d.date);
    return {idx:i,dates:w,range};
  }).filter(w=>w.range.length>0);
  const activeIdx=Math.min(Math.max(state.activeWeek||0,0), wks.length-1);
  const active=wks[activeIdx]||null;
  const tabsHtml=wks.length>1?`<div class="week-tabs">
    ${wks.map((w,i)=>{
      const rng=w.range.length>1
        ?`${mdLabel(w.range[0])} ~ ${mdLabel(w.range[w.range.length-1])}`
        :mdLabel(w.range[0]);
      return `<button class="week-tab ${i===activeIdx?'on':''}" data-act="pickweek" data-w="${i}">
        ${w.idx+1}주차<span class="wkn">${rng}</span></button>`;
    }).join('')}
  </div>`:'';

  // Gantt 형태: 각 날짜 → 멤버 sub-col, 각 셀 = (uid, date, time) 가능/불가
  let grid='';
  if(active){
    const N=members.length;
    let dayHead='<th class="gnt-corner" rowspan="2">시간</th>';
    let memHead='';
    active.dates.forEach(day=>{
      const w=wdOf(day.date);
      const wdCls=w===0?'sun':(w===6?'sat':'');
      const outCls=day.inRange?'':'out';
      dayHead+=`<th class="gnt-day ${wdCls} ${outCls}" colspan="${N}">
        ${day.inRange?mdLabel(day.date):''} <span class="wd">${day.inRange?WD[w]:''}</span></th>`;
      members.forEach((uid,mi)=>{
        const last=mi===N-1?'day-end':'';
        const mnm=itemName(c.people[uid]);
        memHead+=`<th class="gnt-sub dtl-sub ${last}" title="${esc(mnm)}">${esc(mnm)}</th>`;
      });
    });

    let rows=times.map(t=>{
      let cells='';
      active.dates.forEach(day=>{
        if(!day.inRange){
          members.forEach((uid,mi)=>{
            const last=mi===N-1?'day-end':'';
            cells+=`<td class="gnt-cell dtl-cell out ${last}"></td>`;
          });
          return;
        }
        const k=slotKey(day.date,t);
        // 전원 OK 여부 (행 단위)
        const allOk=members.every(u=>!(state.avail[u]&&state.avail[u][k]));
        members.forEach((uid,mi)=>{
          const last=mi===N-1?'day-end':'';
          const unav=!!(state.avail[uid]&&state.avail[uid][k]);
          const cls=unav?'dtl-no':(allOk?'dtl-yes-all':'dtl-yes');
          const mnm=itemName(c.people[uid]);
          const ttl=`${esc(mnm)}: ${unav?'안 됨':'가능'}`;
          cells+=`<td class="gnt-cell dtl-cell ${cls} ${last}" title="${ttl}"></td>`;
        });
      });
      return `<tr><td class="rh">${t}</td>${cells}</tr>`;
    }).join('');

    grid=`<div class="scroll grid-touch"><table class="grid gantt"><thead>
      <tr>${dayHead}</tr><tr>${memHead}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  // 멤버 막대 (얼마나 안 되는지 시각화)
  const memberBars=memberStats.map(m=>{
    const ratio=totalSlots?Math.round((m.busy/totalSlots)*100):0;
    return `<div class="dtl-mbar">
      <span class="dtl-mn">${esc(itemName(c.people[m.uid]))}</span>
      <div class="dtl-mb"><div class="dtl-mf" style="width:${ratio}%"></div></div>
      <span class="dtl-mc">${m.busy}칸 (${ratio}%)</span>
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="card-head">
      <div>
        <h2>곡별 멤버 가능 현황</h2>
        <div class="sub" style="margin:4px 0 0">곡을 고르면 그 곡 멤버들의 시간별 가능/불가능이 캘린더 형태로 표시됩니다. <b style="color:var(--ok)">초록</b> = 가능, <b style="color:var(--accent)">빨강</b> = 안 됨. 진한 초록은 그 시간에 전원 가능한 경우입니다.</div>
      </div>
      <span class="badge" style="color:var(--muted)">${feasibleCount}/${totalSlots} 가능</span>
    </div>
    <div class="song-toggles" style="margin-top:14px">
      <span class="label">곡 선택:</span>
      ${songChips}
    </div>
    ${tabsHtml}
    ${grid||'<div class="empty">날짜·시간 범위를 설정하세요.</div>'}
    ${memberBars?`<div class="dtl-mlist">
      <div class="section-label" style="margin:18px 0 10px">${esc(songNm)} 멤버별 불가 시간 비율</div>
      ${memberBars}
    </div>`:''}
  </div>`;
}

/* ---------------- 이벤트 ---------------- */
function bindEvents(){
  const app=$('app'), hbar=$('hbar');

  function handleClick(e){
    const t=e.target.closest('[data-act]'); if(!t)return;
    const act=t.dataset.act;
    if(act==='home'){location.href=location.pathname;return;}
    if(act==='copycode'){copyCode();return;}
    if(act==='new'){createProject();return;}
    if(act==='open'){location.href=location.pathname+'?p='+t.dataset.pid;return;}
    if(act==='enter'){
      const v=($('codeIn').value||'').trim().toUpperCase();
      if(v)location.href=location.pathname+'?p='+v;return;}
    if(act==='tab'){state.tab=t.dataset.tab;render();return;}
    if(act==='preset'){loadPreset();return;}
    if(act==='addsong'){addSong();return;}
    if(act==='delsong'){delSong(t.dataset.sid);return;}
    if(act==='addperson'){addPerson();return;}
    if(act==='delperson'){delPerson(t.dataset.uid);return;}
    if(act==='mx'){matrixToggle(t.dataset.sid,t.dataset.uid);return;}
    if(act==='lock'){toggleLock();return;}
    if(act==='delproject'){delProject();return;}
    if(act==='pickweek'){state.activeWeek=+t.dataset.w;render();return;}
    if(act==='pickdetailsong'){state.detailSong=t.dataset.sid;render();return;}
    if(act==='exportpng'){exportPNG();return;}
    if(act==='exportics'){exportICS();return;}
    if(act==='pickmember'){
      const uid=t.dataset.uid;
      state.me=uid;
      if(state.pid) lsSet('me_'+state.pid,uid);
      render();return;
    }
    if(act==='toggledone'){toggleDone();return;}
    if(act==='toggleall'){
      const sIds=sortedIds(state.config.songs||{}).filter(s=>songMembers(s).length>0);
      const allShown=sIds.every(s=>!state.hiddenSongs[s]);
      state.hiddenSongs = allShown ? Object.fromEntries(sIds.map(s=>[s,true])) : {};
      render();return;
    }
  }
  app.addEventListener('click',handleClick);
  hbar.addEventListener('click',handleClick);

  app.addEventListener('change',e=>{
    const t=e.target.closest('[data-act]'); if(!t)return;
    const act=t.dataset.act, v=t.value;
    if(act==='cfgname')cfgUpdate({name:v.trim()||'이름 없음'});
    else if(act==='cfgstart')cfgUpdate({startDate:v});
    else if(act==='cfgend'){
      if(state.config&&v<state.config.startDate){alert('종료일은 시작일 이후여야 합니다.');render();return;}
      cfgUpdate({endDate:v});}
    else if(act==='cfgsh'){
      if(+v>=state.config.endHour){alert('시작 시각은 종료 시각보다 빨라야 합니다.');render();return;}
      cfgUpdate({startHour:+v});}
    else if(act==='cfgeh'){
      if(+v<=state.config.startHour){alert('종료 시각은 시작 시각보다 늦어야 합니다.');render();return;}
      cfgUpdate({endHour:+v});}
    else if(act==='cfgslot')cfgUpdate({slotMinutes:+v});
    else if(act==='songname'){
      const cur=state.config.songs?.[t.dataset.sid];
      const ts=itemTs(cur);
      FB.set(R('projects/'+state.pid+'/config/songs/'+t.dataset.sid),{name:v.trim()||'곡',ts});
    }
    else if(act==='personname'){
      const cur=state.config.people?.[t.dataset.uid];
      const ts=itemTs(cur);
      FB.set(R('projects/'+state.pid+'/config/people/'+t.dataset.uid),{name:v.trim()||'멤버',ts});
    }
    else if(act==='pickme'){state.me=v||null;
      if(state.me)lsSet('me_'+state.pid,state.me);render();}
    else if(act==='togglesong'){
      const sid=t.dataset.sid;
      if(t.checked) delete state.hiddenSongs[sid];
      else state.hiddenSongs[sid]=true;
      render();
    }
    else if(act==='filtermember'){
      state.finalFilter=v||'';
      render();
    }
  });

  app.addEventListener('blur',e=>{
    if(e.target.tagName==='INPUT'&&e.target.type==='text'&&deferRender){
      deferRender=false; setTimeout(render,30);
    }
  },true);

  /* 그리드 칠하기 — 박스 드래그 (상하좌우) */
  let paintTarget=true, startCell=null, sx=0, sy=0, pType='';
  let dragR0=0, dragC0=0, dragR1=0, dragC1=0;
  let snapshot={}, dragGrid=null;

  function applyBox(){
    if(!dragGrid) return;
    const minR=Math.min(dragR0,dragR1), maxR=Math.max(dragR0,dragR1);
    const minC=Math.min(dragC0,dragC1), maxC=Math.max(dragC0,dragC1);
    dragGrid.querySelectorAll('td.cell[data-cell]').forEach(td=>{
      const r=+td.dataset.r, c=+td.dataset.c;
      const inBox=r>=minR&&r<=maxR&&c>=minC&&c<=maxC;
      td.classList.toggle('no', inBox ? paintTarget : !!snapshot[td.dataset.slot]);
    });
  }
  function commitBox(){
    if(!dragGrid) return;
    const minR=Math.min(dragR0,dragR1), maxR=Math.max(dragR0,dragR1);
    const minC=Math.min(dragC0,dragC1), maxC=Math.max(dragC0,dragC1);
    const updates={};
    state.avail[state.me]=state.avail[state.me]||{};
    dragGrid.querySelectorAll('td.cell[data-cell]').forEach(td=>{
      const r=+td.dataset.r, c=+td.dataset.c;
      if(r<minR||r>maxR||c<minC||c>maxC) return;
      const k=td.dataset.slot;
      const had=!!snapshot[k];
      if(paintTarget===had) return;
      if(paintTarget){ state.avail[state.me][k]=true; updates[k]=true; }
      else { delete state.avail[state.me][k]; updates[k]=null; }
    });
    if(Object.keys(updates).length)
      FB.update(R('projects/'+state.pid+'/avail/'+state.me),updates);
  }
  function singleTap(td){
    const on=!td.classList.contains('no');
    const k=td.dataset.slot;
    td.classList.toggle('no',on);
    state.avail[state.me]=state.avail[state.me]||{};
    const upd={};
    if(on){ state.avail[state.me][k]=true; upd[k]=true; }
    else { delete state.avail[state.me][k]; upd[k]=null; }
    FB.update(R('projects/'+state.pid+'/avail/'+state.me),upd);
  }

  app.addEventListener('pointerdown',e=>{
    const td=e.target.closest('td.cell[data-cell]'); if(!td||!state.me)return;
    pType=e.pointerType; startCell=td; sx=e.clientX; sy=e.clientY;
    if(pType==='mouse'){
      e.preventDefault();
      paintTarget=!td.classList.contains('no');
      dragR0=dragR1=+td.dataset.r;
      dragC0=dragC1=+td.dataset.c;
      snapshot={...(state.avail[state.me]||{})};
      dragGrid=td.closest('table');
      painting=true;
      applyBox();
    }
  });
  app.addEventListener('pointerover',e=>{
    if(!painting)return;
    const td=e.target.closest('td.cell[data-cell]'); if(!td)return;
    if(td.closest('table')!==dragGrid) return; // 다른 주차 그리드로 드래그 넘어가지 않게
    const r=+td.dataset.r, c=+td.dataset.c;
    if(r===dragR1&&c===dragC1)return;
    dragR1=r; dragC1=c;
    applyBox();
  });
  window.addEventListener('pointerup',e=>{
    if(painting){
      painting=false;
      commitBox();
      dragGrid=null;
      if(deferRender){deferRender=false;render();}
      return;
    }
    if(startCell&&pType!=='mouse'){
      const moved=Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy);
      const td=document.elementFromPoint(e.clientX,e.clientY);
      if(moved<12&&td&&td.closest('td.cell')===startCell&&state.me){
        singleTap(startCell);
      }
      startCell=null;
    }
  });

  /* 간트 sub-cell — 같은 sub-col(곡×날짜) 안에서 세로 드래그로 시간 범위 토글 */
  let gGrid=null, gSid='', gCol='', gR0=0, gR1=0;
  let gSnap={}, gFlipTo=true;
  let gTouchCell=null, gSx=0, gSy=0;

  function canAssignAt(sid,k){
    return slotOkForSong(sid,k) && slotConflicts(sid,k).length===0;
  }
  function renderGanttCell(td,sid,k,assigned){
    td.classList.remove('has','feasible','infeasible','conflict');
    td.style.background='';
    if(assigned){
      td.classList.add('has'); td.style.background=songColor(sid); return;
    }
    if(!slotOkForSong(sid,k)){ td.classList.add('infeasible'); return; }
    if(slotConflicts(sid,k).length){ td.classList.add('conflict'); return; }
    td.classList.add('feasible'); td.style.background=songColorLight(sid);
  }
  function applyGanttDrag(){
    if(!gGrid) return;
    const minR=Math.min(gR0,gR1), maxR=Math.max(gR0,gR1);
    gGrid.querySelectorAll(`td.gnt-cell[data-col="${gCol}"]`).forEach(td=>{
      const r=+td.dataset.r;
      const k=td.dataset.slot;
      const wasAssigned=!!gSnap[k];
      let nowAssigned;
      if(r<minR||r>maxR) nowAssigned=wasAssigned;
      else if(gFlipTo) nowAssigned = canAssignAt(gSid,k) ? true : wasAssigned;
      else nowAssigned=false;
      renderGanttCell(td,gSid,k,nowAssigned);
    });
  }
  function commitGanttDrag(){
    if(!gGrid) return;
    const minR=Math.min(gR0,gR1), maxR=Math.max(gR0,gR1);
    const updates={};
    gGrid.querySelectorAll(`td.gnt-cell[data-col="${gCol}"]`).forEach(td=>{
      const r=+td.dataset.r;
      if(r<minR||r>maxR) return;
      const k=td.dataset.slot;
      const wasAssigned=!!gSnap[k];
      const target = gFlipTo ? canAssignAt(gSid,k) : false;
      if(target!==wasAssigned) updates[k]= target?true:null;
    });
    if(!Object.keys(updates).length) return;
    state.schedule[gSid]=state.schedule[gSid]||{};
    for(const k in updates){
      if(updates[k]) state.schedule[gSid][k]=true;
      else delete state.schedule[gSid][k];
    }
    FB.update(R('projects/'+state.pid+'/schedule/'+gSid),updates);
  }
  function ganttSingleTap(td){
    const sid=td.dataset.sid, k=td.dataset.slot;
    const cur=isAssigned(sid,k);
    if(cur){
      state.schedule[sid]=state.schedule[sid]||{};
      delete state.schedule[sid][k];
      FB.update(R('projects/'+state.pid+'/schedule/'+sid),{[k]:null});
      return;
    }
    if(!slotOkForSong(sid,k)){ toast('이 시간엔 멤버가 안 됩니다'); return; }
    const cfs=slotConflicts(sid,k);
    if(cfs.length){
      const nm=cfs.map(x=>itemName(state.config.songs[x.sid])).join(', ');
      toast(`멤버 겹침: ${nm}`); return;
    }
    state.schedule[sid]=state.schedule[sid]||{};
    state.schedule[sid][k]=true;
    FB.update(R('projects/'+state.pid+'/schedule/'+sid),{[k]:true});
  }

  app.addEventListener('pointerdown',e=>{
    const td=e.target.closest('td.gnt-cell[data-gantt]'); if(!td) return;
    if(e.pointerType==='mouse'){
      e.preventDefault();
      gSid=td.dataset.sid;
      gCol=td.dataset.col;
      gR0=gR1=+td.dataset.r;
      gGrid=td.closest('table');
      gSnap={...(state.schedule[gSid]||{})};
      // 시작 셀이 has면 erase 모드, 아니면 paint 모드
      gFlipTo=!td.classList.contains('has');
      // infeasible/conflict 시작은 무시
      if(td.classList.contains('infeasible')||td.classList.contains('conflict')){
        gGrid=null; return;
      }
      gPainting=true;
      applyGanttDrag();
    } else {
      gTouchCell=td; gSx=e.clientX; gSy=e.clientY;
    }
  });
  app.addEventListener('pointerover',e=>{
    if(!gPainting) return;
    const td=e.target.closest('td.gnt-cell[data-gantt]'); if(!td) return;
    if(td.closest('table')!==gGrid) return;
    if(td.dataset.col!==gCol) return; // 같은 sub-col 안에서만
    const r=+td.dataset.r;
    if(r===gR1) return;
    gR1=r;
    applyGanttDrag();
  });
  window.addEventListener('pointerup',e=>{
    if(gPainting){
      gPainting=false;
      commitGanttDrag();
      gGrid=null;
      if(deferRender){deferRender=false;render();}
      return;
    }
    if(gTouchCell){
      const moved=Math.abs(e.clientX-gSx)+Math.abs(e.clientY-gSy);
      const td=document.elementFromPoint(e.clientX,e.clientY);
      if(moved<12&&td&&td.closest('td.gnt-cell')===gTouchCell){
        ganttSingleTap(gTouchCell);
      }
      gTouchCell=null;
    }
  });
}

/* ---------------- 시작 ---------------- */
async function start(){
  bindEvents(); render();
  const status=await initFirebase();
  if(status==='no-config'){state.screen='no-config';render();return;}
  if(status==='error'){state.screen='fb-error';render();return;}
  const pid=new URLSearchParams(location.search).get('p');
  if(pid){
    state.pid=pid; state.screen='project';
    state.me=lsGet('me_'+pid)||null;
    subscribeProject(pid);
  }else{
    state.screen='landing'; subscribeIndex();
  }
  render();
}
start();
