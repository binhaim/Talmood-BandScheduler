async function ensureH2c(){
  if(window.html2canvas) return window.html2canvas;
  await new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
  return window.html2canvas;
}
function projectPNGWeek(){
  const c=state.config;
  if(!c) return null;
  const weeks=buildWeeks(dateList(c.startDate,c.endDate))
    .map(dates=>({dates,range:dates.filter(d=>d.inRange).map(d=>d.date)}))
    .filter(w=>w.range.length);
  return weeks[Math.min(Math.max(state.activeWeek||0,0),weeks.length-1)]||null;
}
function projectPNGWeekRange(week){
  if(!week) return '';
  const label=ds=>ds.split('-').map(Number).join('.');
  const first=label(week.range[0]), last=label(week.range[week.range.length-1]);
  return first===last?first:`${first} - ${last}`;
}
function buildProjectPNGSnapshot(){
  const c=state.config, week=projectPNGWeek();
  if(!c||!week) return null;
  const filterUid=state.finalFilter&&c.people?.[state.finalFilter]?state.finalFilter:null;
  const dateSet=new Set(week.range);
  const byDate={};
  consolidateBlocks(filterUid).filter(b=>dateSet.has(b.date)).forEach(b=>{
    (byDate[b.date]=byDate[b.date]||[]).push(b);
  });
  const days=week.dates.filter(d=>d.inRange&&byDate[d.date]?.length);

  const stage=document.createElement('div');
  stage.className='project-png-export';
  stage.setAttribute('aria-hidden','true');
  stage.style.width=`${Math.min(1280,Math.max(720,days.length*300+60))}px`;

  const head=document.createElement('div');
  head.className='project-png-head';
  const title=document.createElement('div');
  title.className='project-png-title';
  title.textContent=c.name||'일정';
  const range=document.createElement('div');
  range.className='project-png-range';
  range.textContent=projectPNGWeekRange(week);
  head.append(title,range);

  const content=document.createElement('div');
  if(days.length){
    content.className='project-png-week';
    content.style.setProperty('--png-cols',String(Math.min(4,days.length)));
    days.forEach(d=>{
      const wd=wdOf(d.date);
      const day=document.createElement('section');
      day.className=`project-png-day ${wd===0?'sun':wd===6?'sat':''}`.trim();

      const dayHead=document.createElement('div');
      dayHead.className='project-png-day-head';
      const dayDate=document.createElement('strong');
      dayDate.textContent=mdLabel(d.date);
      const dayWd=document.createElement('span');
      dayWd.textContent=`${WD[wd]}요일`;
      dayHead.append(dayDate,dayWd);

      const events=document.createElement('div');
      events.className='project-png-events';
      byDate[d.date].sort((a,b)=>parseTime(a.start)-parseTime(b.start)).forEach(b=>{
        const event=document.createElement('div');
        event.className=`project-png-event${b.ext?' ext':''}`;
        event.style.setProperty('--sc',songColor(b.sid));
        event.style.color=songTextColor(b.sid);
        const time=document.createElement('div');
        time.className='project-png-time';
        time.textContent=`${b.start} - ${b.end}`;
        const song=document.createElement('div');
        song.className='project-png-song';
        song.textContent=itemName(c.songs[b.sid])||'활동';
        if(b.ext){
          const tag=document.createElement('span');
          tag.className='project-png-ext';
          tag.textContent='외부';
          song.appendChild(tag);
        }
        event.append(time,song);
        events.appendChild(event);
      });
      day.append(dayHead,events);
      content.appendChild(day);
    });
  }else{
    content.className='project-png-empty';
    content.textContent='선택한 주차에 배정된 일정이 없습니다.';
  }

  stage.append(head,content);
  document.body.appendChild(stage);
  return stage;
}
async function exportPNG(){
  if(!document.getElementById('cal-snapshot')){ toast('저장할 내용이 없습니다'); return; }
  toast('PNG 생성 중...');
  let el=null;
  try{
    const h2c=await ensureH2c();
    el=buildProjectPNGSnapshot();
    if(!el) throw new Error('PNG snapshot unavailable');
    if(document.fonts?.ready) await document.fonts.ready;
    const width=el.scrollWidth, height=el.scrollHeight;
    const canvas=await h2c(el,{backgroundColor:'#fffdf7',scale:1.5,width,height,
      windowWidth:Math.max(width,document.documentElement.clientWidth),
      windowHeight:Math.max(height,document.documentElement.clientHeight)});
    const c=state.config;
    const who=state.finalFilter ? itemName(c.people[state.finalFilter]) : 'all';
    // 1) 파일 다운로드
    const link=document.createElement('a');
    link.download=`${(c.name||'schedule').replace(/[\\/:*?"<>|]/g,'_')}-${who}.png`;
    link.href=canvas.toDataURL('image/png');
    link.click();
    // 2) 클립보드에도 복사 (지원 브라우저만 — HTTPS + Clipboard API + ClipboardItem)
    let clipOk=false;
    try{
      if(navigator.clipboard && window.ClipboardItem){
        const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
        if(blob){ await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]); clipOk=true; }
      }
    }catch(_){ /* 권한·미지원 등 — 다운로드만 성공 */ }
    toast(clipOk?'PNG 저장 + 클립보드 복사 완료':'PNG 저장 완료');
  }catch(e){ console.error(e); toast('PNG 저장 실패'); }
  finally{ el?.remove(); }
}

function escapeICS(s){
  return String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\r?\n/g,'\\n');

function memberCalendarKey(memberName){
  const normalized=String(memberName||'').normalize('NFC').trim().toLocaleLowerCase('ko-KR');
  const bytes=new TextEncoder().encode(normalized);
  let binary='';
  bytes.forEach(byte=>{binary+=String.fromCharCode(byte);});
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function memberCalendarUrl(memberName){

function exportICS(){
  const c=state.config; if(!c) return;
  const blocks=consolidateBlocks(state.finalFilter||null);
  if(!blocks.length){ toast('배정된 시간표가 없습니다'); return; }
  const pad=n=>String(n).padStart(2,'0');
  const now=new Date();
  const dtstamp=`${now.getUTCFullYear()}${pad(now.getUTCMonth()+1)}${pad(now.getUTCDate())}T${pad(now.getUTCHours())}${pad(now.getUTCMinutes())}${pad(now.getUTCSeconds())}Z`;
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//talmood//timetable//KO','CALSCALE:GREGORIAN'];
  blocks.forEach(b=>{
    // overnight (확장 시각) 일 수 있으니 실제 캘린더 (날짜, 시각) 로 정규화
    const ns=normalizeDT(b.date,parseTime(b.start));
    const ne=normalizeDT(b.date,parseTime(b.end));
    const dstart=ns.date.replace(/-/g,'')+'T'+pad(Math.floor(ns.min/60))+pad(ns.min%60)+'00';
    const dend=ne.date.replace(/-/g,'')+'T'+pad(Math.floor(ne.min/60))+pad(ne.min%60)+'00';
    const songNm=itemName(c.songs[b.sid]);
    const memNm=b.members.map(u=>itemName(c.people[u])).join(', ');
    lines.push('BEGIN:VEVENT');
    lines.push(`UID:${state.pid}-${b.sid}-${b.date}-${b.start.replace(':','')}@talmood.app`);
    lines.push(`DTSTAMP:${dtstamp}`);
    lines.push(`DTSTART:${dstart}`);
    lines.push(`DTEND:${dend}`);
    lines.push(`SUMMARY:일정 · ${escapeICS(songNm+(b.ext?' (외부)':''))}`);
    lines.push(`DESCRIPTION:${escapeICS('참여자: '+memNm)}`);
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const ics=lines.join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const who=state.finalFilter?itemName(c.people[state.finalFilter]):'all';
  const link=document.createElement('a');
  link.href=url;

}
/* ===== 합주 시간표 → 구글시트 붙여넣기용 TSV (시간 × 일~토, 칸=곡명) ===== */
function sheetPadHM(m){ return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function sheetTimeRows(){           // 00:00~24:00 전체, 30분
  const out=[];
  for(let m=0;m<1440;m+=30) out.push(sheetPadHM(m)+'~'+sheetPadHM(m+30)); // 00:00~00:30 … 23:30~24:00
  return out;
}
function sheetRowLabel(m){          // 30분 경계 분 → 시트 행 라벨 (00:00~24:00)
  if(m<0) m=0; if(m>=1440) m=1410;
  return sheetPadHM(m)+'~'+sheetPadHM(m+30);
}
function buildSheetTSV(){
  const c=state.config, sched=state.schedule||{}, sm=c.slotMinutes||60;
  const cell={}, dates=new Set();
  for(const sid in sched){
    const song=c.songs&&c.songs[sid]; if(!song) continue;
    const nm=itemName(song);
    for(const k in sched[sid]){ const sv=sched[sid][k]; if(!sv||sv==='e') continue;   // 외부 슬롯 제외(동방만)
      const bar=k.indexOf('|'); const d=k.slice(0,bar), t=k.slice(bar+1), t0=parseTime(t);
      for(let m=t0;m<t0+sm;m+=30){
        const nrm=normalizeDT(d,m);                          // overnight → 다음 캘린더 날짜로
        const key=nrm.date+'|'+sheetRowLabel(nrm.min);
        const arr=cell[key]||(cell[key]=[]);
        if(!arr.includes(nm)) arr.push(nm); dates.add(nrm.date);
      }
    }
  }
  if(!dates.size) return null;
  const sundays={};
  dates.forEach(d=>{ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()-x.getDay()); sundays[fmtDate(x)]=true; });
  const rows=sheetTimeRows(), lines=[];
  Object.keys(sundays).sort().forEach((sun,wi)=>{
    if(wi) lines.push('');
    const days=[]; const x=new Date(sun+'T00:00:00');
    for(let i=0;i<7;i++){ days.push(fmtDate(x)); x.setDate(x.getDate()+1); }
    lines.push(['시간'].concat(days.map(d=>WD[wdOf(d)]+' '+mdLabel(d))).join('\t'));
    rows.forEach(rl=>lines.push([rl].concat(days.map(d=>{ const a=cell[d+'|'+rl]; return a?a.join(', '):''; })).join('\t')));
  });
  return lines.join('\n');
}

function dateTimeLocalValue(ms){

}
function scheduleKeyStartMs(k){
  const [date,time]=(k||'').split('|'); if(!date||!time) return NaN;
  const base=new Date(date+'T00:00:00').getTime();
  return isNaN(base)?NaN:base+parseTime(time)*60000;
}
function projectSlotMap(config){
  const map=new Map(); if(!config) return map;

async function saveAggregateEdit(){
  syncAggregateEditDraft();
  const edit=state.aggEdit, data=state.allSched?.[edit?.pid], cfg=data?.config;
  if(!edit||!cfg||state.index?.[edit.pid]?.trashedAt){toast('저장할 프로젝트를 찾을 수 없습니다');return;}
  if(!cfg.songs?.[edit.sid]){toast('활동을 선택하세요');return;}
  const sm=Number(cfg.slotMinutes)||60, step=sm*60000;
  const rawStart=new Date(edit.start).getTime(), rawEnd=new Date(edit.end).getTime();
  if(!isFinite(rawStart)||!isFinite(rawEnd)){toast('시작과 종료 시각을 확인하세요');return;}
  const start=Math.round(rawStart/step)*step, end=Math.round(rawEnd/step)*step;  // 저장 직전에도 칸 단위로 반올림
  if(end<=start){toast('시작과 종료 시각을 확인하세요');return;}
  const slots=projectSlotMap(cfg), newKeys=[];
  for(let ms=start;ms<end;ms+=step){const k=slots.get(ms);if(!k){toast('프로젝트의 날짜·시간 설정 범위 안에서 선택하세요');return;}newKeys.push(k);}
  if(!newKeys.length){toast('한 칸 이상의 일정을 선택하세요');return;}
  const oldKeys=edit.isNew?[]:aggregateEditOriginalKeys(edit);
  if(!edit.isNew&&!oldKeys.length){toast('원본 일정이 변경되었습니다. 다시 선택하세요');state.aggEdit=null;render();return;}

  const targetSchedule={};
  Object.keys(data.schedule||{}).forEach(sid=>{targetSchedule[sid]={...(data.schedule[sid]||{})};});
  oldKeys.forEach(k=>{if(targetSchedule[edit.originalSid])delete targetSchedule[edit.originalSid][k];});
  if(newKeys.some(k=>targetSchedule[edit.sid]?.[k])){toast('선택한 시간에 같은 활동 일정이 이미 있습니다');return;}
  const compare={};
  Object.keys(state.allSched||{}).forEach(pid=>{
    if(state.index?.[pid]?.trashedAt) return;
    compare[pid]=pid===edit.pid?{config:cfg,schedule:targetSchedule}:state.allSched[pid];
  });
  const memberKeys=new Set(Object.keys(cfg.matrix?.[edit.sid]||{}).filter(uid=>cfg.matrix[edit.sid][uid]&&cfg.people?.[uid])
    .map(uid=>memberNameKey(cfg.people[uid])).filter(Boolean));
  const conflicts=[];
  for(const interval of buildScheduleIntervals(compare)){
    if(!newKeys.some(k=>{const s=scheduleKeyStartMs(k);return interval.s<s+step&&interval.e>s;})) continue;
    const shared=interval.memberKeys.some(name=>memberKeys.has(name));
    const roomClash=!edit.ext&&!interval.ext;
    if(shared||roomClash) conflicts.push(interval);
  }
  if(conflicts.length){
    const first=conflicts[0], other=state.allSched?.[first.pid];
    const project=itemName(other?.config?.name)||state.index?.[first.pid]?.name||first.pid;
    const song=itemName(other?.config?.songs?.[first.sid])||'활동';
    toast(`일정 충돌: ${project} · ${song}`); return;
  }

  try{
    const avail=(await FB.get(R('projects/'+edit.pid+'/avail'))).val()||{};
    const unavailable=Object.keys(cfg.matrix?.[edit.sid]||{}).filter(uid=>
      cfg.matrix[edit.sid][uid]&&cfg.people?.[uid]&&newKeys.some(k=>avail[uid]?.[k]));
    if(unavailable.length){
      const names=unavailable.map(uid=>itemName(cfg.people[uid])).filter(Boolean);
      const shown=names.length?names.slice(0,4).join(', ')+(names.length>4?` 외 ${names.length-4}명`:''):`${unavailable.length}명`;
      const action=edit.isNew?'추가':'저장';
      if(!confirm(`선택한 시간에 불가능한 멤버가 있습니다: ${shown}\n그래도 일정을 ${action}할까요?`)) return;
    }
  }catch(e){
    console.error('availability check failed',e); toast('멤버 가능 시간을 확인하지 못했습니다'); return;
  }

  const updates={};
  oldKeys.forEach(k=>{updates['projects/'+edit.pid+'/schedule/'+edit.originalSid+'/'+k]=null;});
  newKeys.forEach(k=>{updates['projects/'+edit.pid+'/schedule/'+edit.sid+'/'+k]=edit.ext?'e':true;});
  try{
    await FB.update(R(''),updates); state.aggEdit=null; render(); toast(edit.isNew?'일정을 추가했습니다':'일정을 수정했습니다');
  }catch(e){console.error(e);toast(edit.isNew?'일정을 추가하지 못했습니다':'일정을 수정하지 못했습니다');}
}

/* 같은 이름의 다른 인물에 합치기 — 그룹·참여표·가용시간·완료를 이전 후 임시 uid 제거 */
function mergePerson(fromUid,toUid,silent){
  if(fromUid===toUid) return;
  const cfg=state.config; if(!cfg?.people?.[toUid]) return;
  // 1) 모든 그룹의 members
  for(const gid in (cfg.groups||{})){
    const g=cfg.groups[gid];
    if(g.members?.[fromUid]){
      delete g.members[fromUid];
      FB.remove(R('projects/'+state.pid+'/config/groups/'+gid+'/members/'+fromUid));
      if(!g.members[toUid]){
        g.members[toUid]=true;
        FB.set(R('projects/'+state.pid+'/config/groups/'+gid+'/members/'+toUid),true);
      }
    }
  }
  // 2) matrix
  for(const sid in (cfg.matrix||{})){
    if(cfg.matrix[sid]?.[fromUid]){
      delete cfg.matrix[sid][fromUid];
      FB.remove(R('projects/'+state.pid+'/config/matrix/'+sid+'/'+fromUid));
      if(!cfg.matrix[sid][toUid]){
        cfg.matrix[sid][toUid]=true;
        FB.set(R('projects/'+state.pid+'/config/matrix/'+sid+'/'+toUid),true);
      }
    }
  }
  // 3) avail: toUid 데이터가 없을 때만 이전, 있으면 toUid 우선
  if(state.avail?.[fromUid] && !state.avail?.[toUid]){
    FB.set(R('projects/'+state.pid+'/avail/'+toUid),state.avail[fromUid]);
    state.avail[toUid]=state.avail[fromUid];
  }
  FB.remove(R('projects/'+state.pid+'/avail/'+fromUid));
  if(state.avail) delete state.avail[fromUid];
  // 4) done
  if(state.done?.[fromUid] && !state.done?.[toUid]){
    FB.set(R('projects/'+state.pid+'/done/'+toUid),true);
    state.done[toUid]=true;
  }
  FB.remove(R('projects/'+state.pid+'/done/'+fromUid));
  if(state.done) delete state.done[fromUid];
  // 5) people: 임시 uid 제거
  if(cfg.people?.[fromUid]) delete cfg.people[fromUid];
  FB.remove(R('projects/'+state.pid+'/config/people/'+fromUid));
  // 6) state.me 보정 (로컬 저장소도 갱신해야 리로드 후 안 풀림)
  if(state.me===fromUid){ state.me=toUid; if(state.pid) lsSet('me_'+state.pid,toUid); }
  if(!silent) toast('같은 이름의 인물에 합쳤습니다');
}
/* 이름이 같은(대소문자·공백 무시) 인물들을 자동 합치기 — 구버전 데이터에서 누적된 중복 정리.
   기본 자리표시자 이름("참여자 N"/"참여자")은 의도적인 별개 항목으로 보고 건너뜀. */
function deduplicatePeople(){
  const cfg=state.config; if(!cfg?.people) return 0;
  const byName={};
  for(const uid in cfg.people){
    const raw=(cfg.people[uid]?.name||'').trim(); if(!raw) continue;
    if(/^참여자(?: \d+)?$/.test(raw)) continue;
    const key=raw.toLowerCase();
    (byName[key]=byName[key]||[]).push(uid);
  }
  let merged=0;
  for(const nm in byName){
    const uids=byName[nm]; if(uids.length<=1) continue;
    uids.sort((a,b)=>(cfg.people[a].ts||0)-(cfg.people[b].ts||0));   // 가장 오래된 uid를 유지
    const keep=uids[0];
    for(let i=1;i<uids.length;i++){ mergePerson(uids[i],keep,true); merged++; }
  }
  return merged;
}
function lockHash(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return 'h'+h.toString(36); }
function toggleLock(){
  const c=state.config;
  if(c.locked){                              // ── 잠금 해제 ──
    if(c.lockPw){
      const pw=prompt('잠금 해제 비밀번호를 입력하세요'); if(pw==null) return;
      if(lockHash(pw.trim())!==c.lockPw){ toast('비밀번호가 틀립니다'); return; }
    }
    cfgUpdate({locked:false, lockPw:null});
    c.locked=false; delete c.lockPw;         // 낙관적 — 에코 지연 중 수정 창 차단
    toast('설정 잠금을 해제했습니다'); doRender();
  } else {                                   // ── 잠그기 ──
    let hash=c.lockPw;
    if(!hash){
      const np=prompt('설정을 잠글 비밀번호를 정하세요. (해제할 때 필요합니다)'); if(np==null) return;
      const t=np.trim(); if(!t){ toast('비밀번호를 입력하세요'); return; }
      hash=lockHash(t);
    }
    cfgUpdate({locked:true, lockPw:hash});
    c.locked=true; c.lockPw=hash;            // 낙관적
    toast('설정을 잠갔습니다'); doRender();
  }
}

async function emptyTrash(){

  if(!pids.length){ toast('휴지통이 비어 있습니다'); return; }
  if(!confirm(`휴지통의 프로젝트 ${pids.length}개를 영구 삭제할까요?\n모든 설정, 참여자 입력, 시간표가 삭제되며 되돌릴 수 없습니다.`)) return;
  try{

    await FB.update(R(''),updates);

    render(); toast('휴지통을 비웠습니다');

function songMembers(sid){
  const m=state.config.matrix?.[sid]||{};
  return Object.keys(m).filter(u=>m[u]&&state.config.people?.[u]);
}
function slotOkForSong(sid,key){
  return songMembers(sid).every(u=>!(state.avail[u]&&state.avail[u][key]));
}
function unavailCount(key){
  let n=0;for(const u in state.avail) if(state.avail[u][key]) n++;return n;
}
function shortName(s){
  if(!s) return '';
  return /[가-힣]/.test(s) ? s.slice(0,2) : s.slice(0,3);
}
/* 충돌 인지형 축약 — 앞글자가 겹치는 활동명은 구분될 때까지 확장 */
function shortNameMap(names){
  const uniq=[...new Set(names.filter(Boolean))], map={};
  uniq.forEach(s=>{
    let L=/[가-힣]/.test(s)?2:3;
    while(L<s.length && uniq.some(o=>o!==s && o.slice(0,L)===s.slice(0,L))) L++;
    map[s]=s.slice(0,L);
  });
  return map;
}

let deferRender=false, painting=false, gPainting=false;
let bdDrag=null, bdSuppress=false;   // 동방 사용 보드 드래그 상태

/* 랜딩 캘린더 가로 스크롤 가능 여부를 좌우 그림자로 표시 */
function syncAggHint(sc){
  const wrap=sc.closest('.agg-cal-wrap'); if(!wrap) return;
  wrap.classList.toggle('can-l',sc.scrollLeft>2);
  wrap.classList.toggle('can-r',sc.scrollLeft+sc.clientWidth<sc.scrollWidth-2);
}
function render(){
  const a=document.activeElement;
  if(painting||gPainting){deferRender=true;return;}
  if(a&&a.tagName==='INPUT'&&a.type==='text'&&$('app').contains(a)){
    deferRender=true;return;}
  doRender();
}
function doRender(){
  const scrolls=[...$('app').querySelectorAll('.scroll')]
    .map(sc=>({sl:sc.scrollLeft,st:sc.scrollTop}));
  const helpBody=$('app').querySelector('.help-modal .modal-body');
  const helpScroll=helpBody?helpBody.scrollTop:null;
  const ws=window.scrollY||window.pageYOffset||0;
  renderHeader(); renderBody();
  const newScrolls=[...$('app').querySelectorAll('.scroll')];
  newScrolls.forEach((sc,i)=>{
    const s=scrolls[i]; if(!s) return;
    sc.scrollLeft=s.sl; sc.scrollTop=s.st;
  });
  const newHelpBody=$('app').querySelector('.help-modal .modal-body');
  if(newHelpBody&&helpScroll!==null) newHelpBody.scrollTop=helpScroll;
  const aggSc=$('app').querySelector('.agg-cal-scroll');
  if(aggSc){
    if(!aggSc.scrollLeft&&aggScrolledMonth!==state.aggMonth){
      aggScrolledMonth=state.aggMonth;
      const td=aggSc.querySelector('.agg-cell.today');
      if(td) aggSc.scrollLeft=Math.max(0,td.offsetLeft-(aggSc.clientWidth-td.offsetWidth)/2);
    }
    syncAggHint(aggSc);
  }
  window.scrollTo(0,ws);
  syncScrollLock();
}
/* 모달 열림 동안 배경 페이지 스크롤 잠금 — 잠글 때 위치 기억, 풀 때 복원 */
let _lockY=0;
function syncScrollLock(){
  const need=!!(state.dayBoard||state.showHelp||state.sheetExport||state.aggEdit||state.aggSubscribe);
  const has=document.body.classList.contains('no-scroll');
  if(need&&!has){
    _lockY=window.scrollY||0;
    document.body.classList.add('no-scroll');
    document.body.style.top=(-_lockY)+'px';
  }else if(!need&&has){
    document.body.classList.remove('no-scroll');
    document.body.style.top='';
    window.scrollTo(0,_lockY);
  }
}

/* 메인 월간 캘린더와 내보내기가 공유하는 활성 프로젝트/멤버/일정 모델 */
function linkedProjectPeople(config){
  const linked=new Set();
  Object.values(config?.groups||{}).forEach(group=>{
    Object.keys(group?.members||{}).forEach(uid=>{if(group.members[uid])linked.add(uid);});
  });
  Object.values(config?.matrix||{}).forEach(members=>{
    Object.keys(members||{}).forEach(uid=>{if(members[uid])linked.add(uid);});
  });
  return linked;
}
function aggregateSelection(){
  const idx=state.index||{};
  const data={};
  Object.keys(state.allSched||{}).forEach(pid=>{
    if(!idx[pid]?.trashedAt) data[pid]=state.allSched[pid];
  });
  const projectLabel=pid=>itemName(data[pid]?.config?.name)||idx[pid]?.name||pid;
  const pids=Object.keys(data).sort((a,b)=>projectLabel(a).localeCompare(projectLabel(b),'ko')||a.localeCompare(b));
  if(state.aggProject&&!data[state.aggProject]) state.aggProject='';
  const scopePids=state.aggProject?[state.aggProject]:pids;
  const memberMap={};
  scopePids.forEach(pid=>{
    const config=data[pid]?.config||{}, people=config.people||{};
    const linked=linkedProjectPeople(config);
    Object.keys(people).forEach(uid=>{
      if(!linked.has(uid)) return;
      const name=itemName(people[uid]).trim(); if(!name) return;
      const key=name.toLocaleLowerCase('ko-KR');
      if(!memberMap[key]) memberMap[key]=name;
    });
  });
  const memberKeys=Object.keys(memberMap).sort((a,b)=>memberMap[a].localeCompare(memberMap[b],'ko'));
  if(state.aggMember&&!memberMap[state.aggMember]) state.aggMember='';
  const scopedData={}; scopePids.forEach(pid=>{scopedData[pid]=data[pid];});
  const all=buildScheduleIntervals(scopedData).map(o=>{
    const cfg=data[o.pid]?.config||{};
    const matrix=cfg.matrix?.[o.sid]||{};
    const intervalMembers=Object.keys(matrix).filter(uid=>matrix[uid]&&cfg.people?.[uid]).map(uid=>
      itemName(cfg.people[uid]).trim().toLocaleLowerCase('ko-KR'));
    return {...o,memberKeys:intervalMembers};
  });
  const now=new Date(); now.setHours(0,0,0,0);
  if(!/^\d{4}-\d{2}$/.test(state.aggMonth)) state.aggMonth=fmtDate(now).slice(0,7);
  const [year,month]=state.aggMonth.split('-').map(Number);
  const monthStart=new Date(year,month-1,1);
  const nextMonth=new Date(year,month,1);
  const intervals=all.filter(o=>(!state.aggMember||o.memberKeys.includes(state.aggMember))&&
    o.s>=monthStart.getTime()&&o.s<nextMonth.getTime());
  return {idx,data,pids,scopePids,memberMap,memberKeys,intervals,now,year,month,monthStart,nextMonth,
    projectName:state.aggProject?projectLabel(state.aggProject):'',
    memberName:state.aggMember?memberMap[state.aggMember]||'':''};
}

/* 메인 페이지: 모든 프로젝트의 배정된 합주를 월간 캘린더로 */
/* ---------------- 동방 사용 보드 — 프로젝트와 별개의 개인 연습 시트 ---------------- */
const BOARD_COLS=[['d','D','드럼'],['g','G','기타'],['b','B','베이스'],['k','K','키보드'],['v','V','보컬']];
const BOARD_HUES={v:6,g:36,b:140,d:210,k:275};
const BOARD_SH=9, BOARD_EH=27, BOARD_SM=30;   // 9:00 ~ 다음날 3:00, 30분 칸
const bdTimes=()=>timeList(BOARD_SH,BOARD_EH,BOARD_SM);
let _bdRenderTimer=null;
function subscribeRoomBoard(){
  FB.onValue(R('roomBoard'),s=>{ state.roomBoardData=s.val()||{};
    clearTimeout(_bdRenderTimer);   // 연속 에코를 한 번의 렌더로 합침
    _bdRenderTimer=setTimeout(()=>{ if(state.screen==='landing') render(); },60);
  });
}
function bdShiftDate(ds,d){ const t=new Date(ds+'T00:00:00'); t.setDate(t.getDate()+d); return fmtDate(t); }
/* 그 날짜(9시~27시 창)의 30분 행별 합주 점유 — 전체 활성 프로젝트에서 파생 */
function bdRehearsalRows(ds){
  const base=new Date(ds+'T00:00:00').getTime();
  const winS=base+BOARD_SH*3600000, winE=base+BOARD_EH*3600000;
  const idx=state.index||{}, data={};
  Object.keys(state.allSched||{}).forEach(pid=>{ if(!idx[pid]?.trashedAt) data[pid]=state.allSched[pid]; });
  const rows=bdTimes().map(()=>[]);
  buildScheduleIntervals(data).filter(o=>o.s<winE&&o.e>winS).forEach(o=>{
    const cfg=data[o.pid]?.config||{};
    const song=itemName(cfg.songs?.[o.sid])||'합주';
    const from=Math.max(0,Math.floor((o.s-winS)/(BOARD_SM*60000)));
    const to=Math.min(rows.length,Math.ceil((o.e-winS)/(BOARD_SM*60000)));
    for(let i=from;i<to;i++) rows[i].push({song,ext:o.ext});
  });
  return rows;
}
/* 칸 하나에 여러 이름 — 신형은 {이름키:ts,...} 맵, 구형 {name,ts}도 읽기 호환 */
const bdNameKey=n=>String(n||'').trim().replace(/[.#$/\[\]]/g,'');
function bdEntries(cell){
  if(!cell||typeof cell!=='object') return [];
  const out=[];
  if(typeof cell.name==='string'&&cell.name.trim()) out.push({name:cell.name.trim(),ts:Number(cell.ts)||0});
  Object.keys(cell).forEach(k=>{
    if(k==='name'||k==='ts') return;
    out.push({name:k,ts:Number(cell[k])||0});
  });
  return out;
}
const bdHasName=(cell,name)=>bdEntries(cell).some(e=>bdNameKey(e.name)===bdNameKey(name));
/* 내 이름 넣기/빼기 토글 — 다른 사람 이름은 절대 건드리지 않음. 낙관적 반영 + 뒤에서 저장 */
function bdApplyToggle(col,time,name,mode){   // mode: 'add' | 'remove'
  const ds=state.dayBoard; if(!ds) return false;
  const key=bdNameKey(name); if(!key) return false;
  const cell=state.roomBoardData?.[ds]?.[col]?.[time];
  const entries=bdEntries(cell);
  const has=entries.some(e=>bdNameKey(e.name)===key);
  if(mode==='add'&&has) return false;
  if(mode==='remove'&&!has) return false;
  const oldShape=!!(cell&&typeof cell==='object'&&typeof cell.name==='string');
  const next={};
  entries.forEach(e=>{const k=bdNameKey(e.name); if(k) next[k]=Number(e.ts)||Date.now();});
  if(has) delete next[key]; else next[key]=Date.now();
  const d=state.roomBoardData;
  const dayCol=((d[ds]=d[ds]||{})[col]=d[ds][col]||{});
  if(Object.keys(next).length) dayCol[time]=next; else delete dayCol[time];
  const cellPath=`roomBoard/${ds}/${col}/${time}`;
  if(oldShape) FB.set(R(cellPath),Object.keys(next).length?next:null).catch(wErr);   // 구형 칸은 통째로 신형으로 정규화
  else if(has) FB.remove(R(`${cellPath}/${key}`)).catch(wErr);
  else FB.set(R(`${cellPath}/${key}`),next[key]).catch(wErr);
  return true;
}
function bdToggle(col,time,name){
  const cell=state.roomBoardData?.[state.dayBoard]?.[col]?.[time];
  bdApplyToggle(col,time,name,bdHasName(cell,name)?'remove':'add');
  doRender();
}
/* 월간 캘린더용 — 개인 연습을 (같은 이름 연속 칸 병합 후) 실제 달력 날짜별로 묶기 */
function bdMonthPersonal(){
  const out={}, data=state.roomBoardData||{}, times=bdTimes();
  const push=(base,ds,r)=>{
    const abs=base+r.startMin*60000, dd=fmtDate(new Date(abs));
    (out[dd]=out[dd]||[]).push({...r,srcDate:ds,abs,absEnd:base+r.endMin*60000});
  };
  Object.keys(data).forEach(ds=>{
    const base=new Date(ds+'T00:00:00').getTime(); if(isNaN(base)) return;
    BOARD_COLS.forEach(([col,letter])=>{
      const slots=data[ds]?.[col]||{};
      let run=null;   // 같은 인원 구성이 이어지는 구간을 한 덩어리로 병합
      times.forEach(t=>{
        const m=parseTime(t);
        const entries=bdEntries(slots[t]);
        if(!entries.length){ if(run){push(base,ds,run);run=null;} return; }
        const names=entries.map(e=>e.name).sort((a,b)=>a.localeCompare(b,'ko'));
        const key=names.map(bdNameKey).join('|');
        if(run&&run.key===key&&run.endMin===m){ run.endMin=m+BOARD_SM; return; }
        if(run) push(base,ds,run);
        run={col,letter,names,key,startMin:m,endMin:m+BOARD_SM};
      });
      if(run) push(base,ds,run);
    });
  });
  Object.values(out).forEach(a=>a.sort((x,y)=>x.abs-y.abs||x.col.localeCompare(y.col)));
  return out;
}

    const cells=BOARD_COLS.map(([c])=>{
      const entries=bdEntries(day[c]?.[t]);

      }
      return `<td class="bd-cell" style="--bh:${BOARD_HUES[c]}" data-act="bdcell" data-col="${c}" data-time="${t}" data-mine="0"></td>`;
    }).join('');
    return `<tr><td class="bd-time${parseTime(t)>=1440?' ov':''}">${t}</td>${rehCell}${cells}</tr>`;
  }).join('');
  return `<div class="modal-backdrop bd-backdrop" data-act="dayboardclose">
    <div class="modal dayboard-modal" data-act="modal-noop" role="dialog" aria-modal="true" aria-labelledby="dayBoardTitle">
      <div class="modal-head dayboard-head">
        <div class="dayboard-nav">
          <button data-act="dayboardnav" data-d="-1" title="이전 날" aria-label="이전 날">‹</button>
          <h2 id="dayBoardTitle">${mdLabel(ds)} (${WD[wdOf(ds)]}) 동방 사용표</h2>
          <button data-act="dayboardnav" data-d="1" title="다음 날" aria-label="다음 날">›</button>
        </div>
        <button class="modal-x" data-act="dayboardclose" title="닫기" aria-label="동방 사용표 닫기">×</button>
      </div>
      <div class="modal-body dayboard-body">
        <div class="bd-namebar">
          <label for="bdName">내 이름</label>
          <input id="bdName" type="text" value="${esc(myName)}" maxlength="12" placeholder="이름을 먼저 적어주세요">
          <span>칸을 누르면 이 이름으로 적혀요</span>
        </div>
        <div class="bd-scroll scroll"><table class="bd-table"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
        <div class="note">칸을 누르면 <b>내 이름</b>이 들어가고, 다시 누르면 내 이름만 빠집니다 — 다른 사람 이름이 있어도 함께 적을 수 있어요. PC는 드래그로 여러 칸을 한 번에. <b>합주</b> 열은 프로젝트 배정에서 자동 표시됩니다.</div>
      </div>

}

    const lbl = h<24 ? `${h}시` : `${h}시 (다음날 ${h-24}시)`;
    o+=`<option value="${h}" ${h==sel?'selected':''}>${lbl}</option>`;}return o;};

  // ── 그룹 단위 섹션 (활동/참여자/참여표를 그룹마다) ──
  const groups=c.groups||{}; const gIds=sortedIds(groups);
  function renderGroupCard(gid,gi){
    const g=groups[gid]||{};
    const gSongIds=sortedIds(songs).filter(s=>songs[s].gid===gid);
    const gMemIds=Object.keys(g.members||{}).filter(u=>people[u]).sort((a,b)=>itemTs(people[a])-itemTs(people[b]));
    const sRows=gSongIds.length? gSongIds.map((id,i)=>
      `<div class="list-item"><span class="idx">${i+1}</span>
        <input type="text" value="${esc(itemName(songs[id]))}" ${dis} data-act="songname" data-sid="${id}" data-gid="${gid}">
        <button class="x" data-act="delsong" data-sid="${id}" ${dis?'disabled':''} title="삭제">×</button>
      </div>`).join('') : '<div class="empty" style="padding:18px 8px">활동이 없습니다.</div>';
    const mRows=gMemIds.length? gMemIds.map((uid,i)=>
      `<div class="list-item"><span class="idx">${i+1}</span>
        <input type="text" value="${esc(itemName(people[uid]))}" ${dis} data-act="personname" data-uid="${uid}" data-gid="${gid}">
        <button class="x" data-act="grpdelmem" data-gid="${gid}" data-uid="${uid}" ${dis?'disabled':''} title="이 그룹에서 빼기">×</button>
      </div>`).join('') : '<div class="empty" style="padding:18px 8px">참여자가 없습니다.</div>';
    let matrix='';
    if(gSongIds.length&&gMemIds.length){
      let head='<th class="corner">활동 \\ 참여자</th>'+gMemIds.map(u=>`<th class="col">${esc(itemName(people[u]))}</th>`).join('');
      let body=gSongIds.map(s=>{
        let cells=gMemIds.map(u=>{
          const on=c.matrix?.[s]?.[u];
          return `<td class="mx ${on?'on':''}${lk?' locked':''}"${lk?'':' data-act="mx"'} data-sid="${s}" data-uid="${u}"><span class="chk"></span></td>`;
        }).join('');
        return `<tr><td class="song-h">${esc(itemName(songs[s]))}</td>${cells}</tr>`;
      }).join('');
      matrix=`<div class="scroll tall"><table class="grid">
        <thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
        <div class="note">${lk?'🔒 잠겨 있어 수정할 수 없습니다.':'칸을 클릭하면 그 참여자가 그 활동에 참여하는 것으로 표시됩니다.'}</div>`;
    } else {
      matrix='<div class="empty" style="padding:18px 8px">활동과 참여자를 더하면 참여표가 나타납니다.</div>';
    }
    return `<div class="card grp-card">
      <div class="grp-head">
        <span class="grp-idx">${gi+1}</span>
        <input type="text" class="grp-name" value="${esc(itemName(g))}" data-act="groupname" data-gid="${gid}" ${dis}>
        <button class="x" data-act="delgroup" data-gid="${gid}" ${dis?'disabled':''} title="그룹 삭제">×</button>
      </div>
      <div class="grp-sub">
        <div class="grp-sub-head">
          <div class="section-label" style="margin:0">활동 목록 <span class="count">${gSongIds.length}</span></div>
          <button class="btn sm" data-act="addsong" data-gid="${gid}" ${dis}>+ 활동 추가</button>
        </div>
        ${sRows}
      </div>
      <div class="grp-sub">
        <div class="grp-sub-head">
          <div class="section-label" style="margin:0">참여자 목록 <span class="count">${gMemIds.length}</span></div>
          <button class="btn sm" data-act="grpaddmem" data-gid="${gid}" ${dis}>+ 참여자 추가</button>
        </div>
        ${mRows}
      </div>
      <div class="grp-sub">
        <div class="section-label" style="margin:0 0 8px">참여표 — 활동 × 참여자</div>
        ${matrix}
      </div>
    </div>`;
  }
  const groupCards=gIds.length? gIds.map(renderGroupCard).join('') : '';
  const noGroupNote = !gIds.length ? '<div class="card"><div class="empty" style="padding:30px 12px">아직 그룹이 없습니다. 아래 <b>+ 그룹 추가</b>로 첫 그룹을 만드세요.</div></div>' : '';
  const addGroupBar = `<div style="display:flex;justify-content:center;margin:6px 0 14px">
    <button class="btn sm" data-act="addgroup" ${dis}>+ 그룹 추가</button>
  </div>`;

  return `<div class="card">
    <div class="card-head">
      <div>
        <h2>프로젝트 설정</h2>
        <div class="sub" style="margin:4px 0 0">${lk?'<span class="lock-pill">🔒 잠금됨 — 담당자만 수정 (참여자는 내 시간 탭만 사용)</span>':'언제든 자유롭게 수정할 수 있습니다.'}</div>
      </div>
      <button class="btn ghost sm" data-act="lock">${lk?'🔓 잠금 해제':'🔒 설정 잠그기'}</button>
    </div>
    ${lk?'':`<div class="page-intro" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <span>🙋 <b>참여하러 오셨나요?</b> 이 탭은 담당자용 설정 화면입니다 — 안 되는 시간은 <b>내 시간</b> 탭에서 표시하세요.</span>
      <button class="btn sm" data-act="tab" data-tab="participate">내 시간 탭으로 이동 →</button>
    </div>`}
    <div class="page-intro">
      <div class="pi-h">🎯 이 페이지는?</div>
      <p>프로젝트의 <b>뼈대</b>를 만드는 곳입니다. <b>기간·시간대</b>를 정하고, 아래 <b>그룹</b>마다 〈활동·참여자·참여표〉를 따로 작성합니다(예: 기수별, 세션별). 같은 사람을 여러 그룹에 추가하려면 이름을 그대로 입력하세요 — 자동으로 같은 사람으로 묶입니다(시간표 1번만 작성). 다 정했으면 우상단의 <b>🔒 설정 잠그기</b>로 <b>비밀번호</b>를 걸어 두세요. (우발적 수정 방지용 소프트 잠금)</p>
    </div>
    <label class="fld">
      <span class="lab">프로젝트 이름</span>
      <input type="text" value="${esc(c.name||'')}" ${dis} data-act="cfgname" style="width:100%">
    </label>
    <div class="fmt-group">
      <div class="section-label" style="margin:0 0 10px">시간표 포맷 설정</div>
      <div class="row">
        <label class="fld" style="margin-bottom:0"><span class="lab">시작일</span>
          <input type="date" value="${c.startDate||''}" ${dis} data-act="cfgstart"></label>
        <label class="fld" style="margin-bottom:0"><span class="lab">종료일</span>
          <input type="date" value="${c.endDate||''}" ${dis} data-act="cfgend"></label>
      </div>
      <div class="row" style="margin-top:12px">
        <label class="fld" style="margin-bottom:0"><span class="lab">시작 시각</span>
          <select ${dis} data-act="cfgsh">${hourOpts(c.startHour,0,23)}</select></label>
        <label class="fld" style="margin-bottom:0"><span class="lab">종료 시각</span>
          <select ${dis} data-act="cfgeh">${hourOpts(c.endHour,1,(c.startHour||0)+24)}</select></label>
        <label class="fld" style="margin-bottom:0"><span class="lab">칸 단위</span>
          <select ${dis} data-act="cfgslot">
            <option value="60" ${c.slotMinutes==60?'selected':''}>1시간</option>
            <option value="30" ${c.slotMinutes==30?'selected':''}>30분</option>
          </select></label>
      </div>
    </div>
  </div>
  ${groupCards}
  ${noGroupNote}
  ${addGroupBar}
  <div class="card danger-zone">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <div class="section-label" style="margin:0 0 4px;color:var(--accent)">프로젝트 관리</div>
        <div style="font-size:13px;color:var(--muted)">프로젝트를 휴지통으로 옮깁니다. 메인 화면에서 복원할 수 있습니다.</div>
      </div>
      <button class="btn danger sm" data-act="delproject">휴지통으로 이동</button>
    </div>
  </div>`;
}

function viewParticipate(){
  const c=state.config;
  // 어느 그룹에든 속한 사람만 노출
  const inAnyGroup=new Set();
  for(const gid in (c.groups||{})){
    const g=c.groups[gid]; for(const u in (g.members||{})) if(g.members[u]) inAnyGroup.add(u);
  }
  const pIds=sortedIds(c.people||{}).filter(u=>inAnyGroup.has(u));
  if(!pIds.length) return `<div class="card"><div class="empty">설정 화면에서 그룹과 참여자를 먼저 추가하세요.</div></div>`;
  if(state.me && (!c.people[state.me] || !inAnyGroup.has(state.me))) state.me=null;

  let opts='<option value="">— 이름 선택 —</option>'+
    pIds.map(u=>`<option value="${u}" ${state.me===u?'selected':''}>${esc(itemName(c.people[u]))}</option>`).join('');

  const statusChips=pIds.map(u=>{
    const n=countInRange(state.avail[u]);
    const isMe=u===state.me;
    const isDone=!!state.done[u];
    const cls=isDone?'done':(n>0?'pending':'');
    const title=isDone
      ? `작성 완료 · ${n}칸 표시 · 클릭하면 이 사람 일정으로 이동`
      : (n>0?`작성 중 · ${n}칸 표시 · 클릭하면 이 사람 일정으로 이동`
            :'미입력 · 클릭하면 이 사람 일정으로 이동');
    const check=isDone?'<span class="check">✓</span>':'<span class="dot"></span>';
    const ct=isDone?'<span class="ct">완료</span>':(n>0?`<span class="ct">${n}</span>`:'');
    return `<button class="mstat ${cls} ${isMe?'me':''}" data-act="pickmember" data-uid="${u}" title="${title}">
      ${check}${esc(itemName(c.people[u]))}${ct}</button>`;
  }).join('');
  const doneCount=pIds.filter(u=>!!state.done[u]).length;

  let head=`<div class="card">
    <div class="card-head">
      <div>
        <h2>안 되는 시간 입력</h2>
        <div class="sub" style="margin:4px 0 0">본인 이름을 고르고, 참여가<b style="color:var(--accent)">불가능한 칸</b>을 칠하세요. PC는 박스 드래그, 모바일은 꾹 눌러서 드래그.</div>
      </div>
    </div>
    <div class="page-intro">
      <div class="pi-h">🎯 이 페이지는?</div>
      <p>각자 <b>본인의 안 되는 시간</b>을 표시하는 곳입니다. 본인 이름을 고른 뒤 참여가불가능한 시간 칸을 빨갛게 칠하세요. 참여자 현황으로 다른 사람의 진행도 볼 수 있고, 다 입력했으면 우상단의 <b>"작성 완료 체크"</b>를 눌러 다른 사람들에게 알려주세요.</p>
    </div>
    <label class="fld" style="max-width:280px;margin-bottom:0">
      <span class="lab">내 이름</span>
      <select data-act="pickme" style="width:100%">${opts}</select>
    </label>
    <div class="section-label" style="margin:18px 0 0">참여자 현황 <span class="count">${doneCount}/${pIds.length}</span></div>
    <div class="member-status">${statusChips}</div>
  </div>`;

  if(!state.me) return head+`<div class="card"><div class="empty">이름을 선택하면 시간표가 나타납니다.</div></div>`;

  const dates=dateList(c.startDate,c.endDate);
  const times=timeList(c.startHour,c.endHour,c.slotMinutes);
  if(!dates.length||!times.length)
    return head+`<div class="card"><div class="empty">설정에서 날짜·시간 범위를 확인하세요.</div></div>`;

  const mine=state.avail[state.me]||{};
  const myCount=countInRange(mine);
  const wks=buildWeeks(dates).map((w,i)=>{
    const range=w.filter(d=>d.inRange).map(d=>d.date);
    return {idx:i, dates:w, range};
  }).filter(w=>w.range.length>0);
  const activeIdx=Math.min(Math.max(state.activeWeek||0,0), wks.length-1);
  const active=wks[activeIdx]||null;
  const tabsHtml=wks.length>1?`<div class="week-tabs">
    ${wks.map((w,i)=>{
      const rng=w.range.length>1
        ?`${mdLabel(w.range[0])} ~ ${mdLabel(w.range[w.range.length-1])}`
        :mdLabel(w.range[0]);
      return `<button class="week-tab ${i===activeIdx?'on':''}" data-act="pickweek" data-w="${i}">
        ${w.idx+1}주차<span class="wkn">${rng}</span></button>`;
    }).join('')}
  </div>`:'';

  let gridHtml='';
  if(active){
    const WD_MON=['월','화','수','목','금','토','일'];
    let head2='<th class="corner">시간</th>'+active.dates.map((day,di)=>{
      const isSat=di===5,isSun=di===6;
      const cls='col '+(isSat?'sat':'')+(isSun?'sun':'')+(day.inRange?'':' out');
      return `<th class="${cls}">${mdLabel(day.date)}<span class="wd">${WD_MON[di]}</span></th>`;
    }).join('');
    let rows=times.map((t,ri)=>{
      const cells=active.dates.map((day,ci)=>{
        if(!day.inRange) return `<td class="cell out"></td>`;
        const k=slotKey(day.date,t);
        const no=!!mine[k];
        const others=unavailCount(k)-(no?1:0);
        return `<td class="cell ${no?'no':''}" data-cell="1" data-slot="${k}" data-r="${ri}" data-c="${ci}">
          ${others>0?`<span class="cnt">${others}</span>`:''}</td>`;
      }).join('');
      return `<tr><td class="rh">${t}</td>${cells}</tr>`;
    }).join('');
    gridHtml=`<div class="scroll grid-touch"><table class="grid">
      <thead><tr>${head2}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  const meDone=!!state.done[state.me];
  return head+`<div class="card">
    <div class="card-head" style="margin-bottom:10px">
      <h2 style="font-size:15px">${esc(itemName(c.people[state.me]))} 님의 일정</h2>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span class="badge" style="color:${myCount?'var(--accent)':'var(--muted)'}">표시한 시간 ${myCount}칸</span>
        <button class="btn-done ${meDone?'on':''}" data-act="toggledone">
          <span class="check">${meDone?'✓':''}</span>
          ${meDone?'작성 완료됨':'작성 완료 체크'}
        </button>
      </div>
    </div>
    ${tabsHtml}
    ${gridHtml || '<div class="empty">날짜 범위를 설정에서 확인하세요.</div>'}
    <div class="note">빨간 칸 = 내가 안 되는 시간. 칸 모서리의 숫자 = 같은 시간에 안 되는 다른 참여자 수. PC에서는 박스 드래그로 여러 칸 한 번에 선택할 수 있습니다. 다 입력했으면 우상단의 <b>작성 완료 체크</b>를 눌러주세요.</div>
  </div>`;
}

function viewResults(){
  const c=state.config;
  const sIds=sortedIds(c.songs||{});
  if(!sIds.length) return `<div class="card"><div class="empty">설정에서 활동을 추가하세요.</div></div>`;
  const dates=dateList(c.startDate,c.endDate);
  const times=timeList(c.startHour,c.endHour,c.slotMinutes);

  const activeSongs=sIds.filter(s=>songMembers(s).length>0);
  const schedule=state.schedule||{};
  const hidden=state.hiddenSongs||{};
  const isShown=sid=>!hidden[sid];

  // 그룹 선택 (다중, 비어있으면 전체 표시) — 칩 토글로 추가/제거. 0개도 정상 상태.
  const groupsMap=c.groups||{}; const gIds=sortedIds(groupsMap);
  // 레거시 호환: 문자열 → 객체
  if(typeof state.groupFilter==='string') state.groupFilter = state.groupFilter ? {[state.groupFilter]:true} : {};
  state.groupFilter = state.groupFilter || {};
  // 삭제된 그룹 정리 (자동 시드는 하지 않음 — 비어 있으면 전체 그룹)
  for(const k in state.groupFilter) if(!groupsMap[k]) delete state.groupFilter[k];
  const selGids = Object.keys(state.groupFilter).filter(g=>state.groupFilter[g]);
  const inGroupFilter = sid => selGids.length===0 || selGids.includes(c.songs?.[sid]?.gid);
  const groupFilterRow = gIds.length>0 ? `<div class="group-filter">
    <span class="mode-lbl">그룹</span>
    <div class="grp-tog-row">
      ${gIds.map(gid=>{const g=groupsMap[gid]; const on=!!state.groupFilter[gid]; const cnt=activeSongs.filter(s=>c.songs?.[s]?.gid===gid).length; return `<button class="grp-tog ${on?'on':''}" data-act="grouptoggle" data-gid="${gid}">${esc(itemName(g))}<span class="grp-tog-n">${cnt}</span></button>`;}).join('')}
    </div>
    <span class="mode-hint">${selGids.length===0?'전체 그룹 — 칩을 눌러 한정':(selGids.length===1?'한 그룹':selGids.length+'개 그룹 동시')}</span>
  </div>` : '';

  // 활동 토글 — chip style (그룹 필터 적용 후)
  const filteredActive=activeSongs.filter(inGroupFilter);
  const allShown=filteredActive.length && filteredActive.every(isShown);
  let toggleHtml=`<div class="song-toggles">
    <span class="label">표시:</span>
    <button class="btn ghost sm" data-act="toggleall" style="padding:3px 11px;font-size:11px;border-radius:999px">${allShown?'모두 숨기기':'모두 보기'}</button>
    ${filteredActive.map(s=>{
      const on=isShown(s);
      const col=songColor(s);
      const sty=on?`background:${col};border-color:${col};color:${songTextColor(s)}`:'';
      return `<label class="chip-toggle ${on?'on':''}" style="${sty}">
        <input type="checkbox" data-act="togglesong" data-sid="${s}" ${on?'checked':''}>
        <span class="csw" style="background:${col}"></span>${esc(itemName(c.songs[s]))}
      </label>`;}).join('')}
  </div>`;

  // 표시할 활동 (활성 + 그룹필터 + 안 숨김)
  const visibleSongs=filteredActive.filter(isShown);

  const wks=buildWeeks(dates).map((w,i)=>{
    const range=w.filter(d=>d.inRange).map(d=>d.date);
    return {idx:i, dates:w, range};
  }).filter(w=>w.range.length>0);
  const activeIdx=Math.min(Math.max(state.activeWeek||0,0), wks.length-1);
  const active=wks[activeIdx]||null;
  const tabsHtml=wks.length>1?`<div class="week-tabs">
    ${wks.map((w,i)=>{
      const rng=w.range.length>1
        ?`${mdLabel(w.range[0])} ~ ${mdLabel(w.range[w.range.length-1])}`
        :mdLabel(w.range[0]);
      return `<button class="week-tab ${i===activeIdx?'on':''}" data-act="pickweek" data-w="${i}">
        ${w.idx+1}주차<span class="wkn">${rng}</span></button>`;
    }).join('')}
  </div>`:'';

  function ganttCell(sid, k, ri, di, si, isDayEnd){
    const assigned=isAssigned(sid,k);
    const feasible=slotOkForSong(sid,k);
    const cfs=(feasible && !assigned)?slotConflicts(sid,k,roomModeExt()):[];
    let cls='gnt-cell'+(isDayEnd?' day-end':'');
    let style='';
    let title='';
    let content='';
    if(assigned){
      const ext=slotIsExt(sid,k);
      cls+=' has'+(ext?' ext':'')+((ext!==roomModeExt())?' locked':'');
      style=`background:${songColor(sid)}`;
      title=`${itemName(c.songs[sid])}${ext?' (외부)':''} 배정 · ${(ext!==roomModeExt())?(ext?'외부':'동방')+' 모드에서 수정':'클릭하면 해제'}`;
      content=ext?'<span class="gnt-ext">🌐</span>':'';
    } else if(!feasible){
      cls+=' infeasible';
      title='이 시간엔 참여자가 안 됩니다';
    } else if(cfs.length){
      cls+=' conflict';
      title=conflictMessage(cfs);
    } else {
      cls+=' feasible';
      style=`background:${songColorLight(sid)}`;
      title=`${itemName(c.songs[sid])} 클릭하면 배정`;
    }
    return `<td class="${cls}" data-gantt="1" data-sid="${sid}" data-slot="${k}" data-r="${ri}" data-col="${di}-${si}" title="${esc(title)}"${style?` style="${style}"`:''}>${content}</td>`;
  }

  function renderGantt(week){
    const days=week.filter(d=>d.inRange);
    if(!days.length) return '<div class="empty">표시할 날짜가 없습니다.</div>';
    if(!visibleSongs.length) return '<div class="empty">표시할 활동을 위에서 체크하세요.</div>';
    const N=visibleSongs.length;
    const abbr=shortNameMap(visibleSongs.map(sid=>itemName(c.songs[sid])));
    let dayHead='<th class="gnt-corner" rowspan="2">시간</th>';
    let subHead='';
    days.forEach(day=>{
      const w=wdOf(day.date);
      const wdCls=w===0?'sun':(w===6?'sat':'');
      dayHead+=`<th class="gnt-day ${wdCls}" colspan="${N}">
        ${mdLabel(day.date)} <span class="wd">${WD[w]}</span></th>`;
      visibleSongs.forEach((sid,si)=>{
        const last=si===N-1?'day-end':'';
        subHead+=`<th class="gnt-sub ${last}" style="--sc:${songColor(sid)}" title="${esc(itemName(c.songs[sid]))}">${esc(abbr[itemName(c.songs[sid])]||'')}</th>`;
      });
    });
    let rows=times.map((t,ri)=>{
      let cells='';
      days.forEach((day,di)=>{
        visibleSongs.forEach((sid,si)=>{
          const k=slotKey(day.date,t);
          cells+=ganttCell(sid,k,ri,di,si,si===N-1);
        });
      });
      return `<tr><td class="rh">${t}</td>${cells}</tr>`;
    }).join('');
    return `<div class="scroll tall grid-touch"><table class="grid gantt">
      <thead><tr>${dayHead}</tr><tr>${subHead}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  const ganttHtml = active ? renderGantt(active.dates) : '<div class="empty">날짜 범위를 설정에서 확인하세요.</div>';

  const ext=roomModeExt();
  const modeRow=`<div class="mode-row">
    <span class="mode-lbl">배정 장소</span>
    <button class="mode-btn ${ext?'':'on'}" data-act="roommode" data-m="in">🏠 동방</button>
    <button class="mode-btn ext ${ext?'on':''}" data-act="roommode" data-m="ext">🌐 외부</button>
    <span class="mode-hint">${ext?'외부 합주실로 배정 — 같은 시간에 겹쳐 잡을 수 있어요':'동방으로 배정 — 같은 시간엔 한 활동만'}</span>
  </div>`;
  const gridCard=(dates.length&&times.length)
    ? `<div class="card">
        <h2>시간표 — 가능 시간 & 배정</h2>
        <div class="page-intro">
          <div class="pi-h">🎯 이 페이지는?</div>
          <p>실제 <b>일정 시간표를 짜는 곳</b>입니다. 참여자 입력이 종합되어 활동별 가능 시간이 자동 계산되고, 클릭/드래그로 배정·해제합니다. 칸 색: <b>옅은 색</b>=가능, <b>짙은 색</b>=배정됨(외부는 빗금), 빗금 회색=참여자 안 됨. 메인 시간표의 다른 프로젝트 일정도 자동으로 확인해 같은 멤버나 동방 시간이 겹치지 않게 합니다.</p>
        </div>
        ${modeRow}
        ${groupFilterRow}
        ${tabsHtml}
        ${toggleHtml}
        ${ganttHtml}
      </div>`
    : `<div class="card"><div class="note">날짜·시간 범위를 설정하세요.</div></div>`;

  // 최종 시간표 (캘린더 뷰)
  const pIds=sortedIds(c.people||{});
  const filterUid=state.finalFilter&&c.people[state.finalFilter]?state.finalFilter:'';
  const blocks=consolidateBlocks(filterUid||null);
  const memberOpts='<option value="">전체 보기</option>'+
    pIds.map(u=>`<option value="${u}" ${filterUid===u?'selected':''}>${esc(itemName(c.people[u]))}</option>`).join('');

  // 겹치는 블록 → column 분배
  function layoutDayBlocks(arr){
    const sorted=arr.slice().sort((a,b)=>parseTime(a.start)-parseTime(b.start));
    const colEnd=[];
    sorted.forEach(b=>{
      const sm=parseTime(b.start);
      let col=-1;
      for(let i=0;i<colEnd.length;i++) if(colEnd[i]<=sm){col=i;break;}
      if(col===-1){col=colEnd.length;colEnd.push(0);}
      colEnd[col]=parseTime(b.end);
      b._col=col;
    });
    const total=colEnd.length;
    sorted.forEach(b=>b._cols=total);
    return sorted;
  }

  function renderCalWeek(week){
    const sm=c.slotMinutes||60;
    const cellH=36;
    const baseMin=parseTime(times[0]);
    const totalH=times.length*cellH;
    const dateSet=new Set(week.filter(d=>d.inRange).map(d=>d.date));
    const wkBlocks=blocks.filter(b=>dateSet.has(b.date));
    const byD={};
    wkBlocks.forEach(b=>{(byD[b.date]=byD[b.date]||[]).push(b);});
    Object.keys(byD).forEach(d=>{byD[d]=layoutDayBlocks(byD[d]);});

    const timeCells=times.map(t=>`<div class="cal-time" style="height:${cellH}px">${t}</div>`).join('');

    const daysHtml=week.map(d=>{
      const w=wdOf(d.date);
      const wdLabel=['일','월','화','수','목','금','토'][w];
      const wdCls=w===0?'sun':(w===6?'sat':'');
      const outCls=d.inRange?'':'out';
      let bg='';
      for(let i=0;i<times.length;i++) bg+=`<div class="cal-cell" style="height:${cellH}px"></div>`;
      const dayBlocks=byD[d.date]||[];
      const blocksHtml=dayBlocks.map(b=>{
        const sMin=parseTime(b.start), eMin=parseTime(b.end);
        const top=((sMin-baseMin)/sm)*cellH;
        const h=((eMin-sMin)/sm)*cellH-2;
        const leftPct=(b._col/b._cols)*100;
        const wPct=(1/b._cols)*100;
        const songNm=itemName(c.songs[b.sid]);
        const memList=b.members.map(u=>{
          const nm=esc(itemName(c.people[u]));
          return filterUid&&u===filterUid?`<b>${nm}</b>`:nm;
        }).join(' · ');
        const tall=h>50;
        return `<div class="cal-block${b.ext?' ext':''}" style="background:${songColor(b.sid)};color:${songTextColor(b.sid)};top:${top}px;height:${h}px;left:calc(${leftPct.toFixed(2)}% + 1px);width:calc(${wPct.toFixed(2)}% - 2px)" title="${esc(songNm+(b.ext?' (외부)':'')+' · '+b.start+'-'+b.end)}">
          <div class="cb-name">${esc(songNm)}${b.ext?'<span class="ext-tag">외부</span>':''}</div>
          <div class="cb-time">${b.start} – ${b.end}</div>
          ${tall?`<div class="cb-mem">${memList}</div>`:''}
        </div>`;
      }).join('');
      return `<div class="cal-day ${wdCls} ${outCls}">
        <div class="cal-day-body" style="height:${totalH}px">${bg}${blocksHtml}</div>
      </div>`;
    }).join('');

    return `<div class="cal">
      <div class="cal-row cal-head-row">
        <div class="cal-corner"></div>
        <div class="cal-days cal-head-days">
          ${week.map(d=>{
            const w=wdOf(d.date);
            const wdLabel=['일','월','화','수','목','금','토'][w];
            const wdCls=w===0?'sun':(w===6?'sat':'');
            const outCls=d.inRange?'':'out';
            return `<div class="cal-day-head ${wdCls} ${outCls}">${d.inRange?mdLabel(d.date):''} <span>${d.inRange?wdLabel:''}</span></div>`;
          }).join('')}
        </div>
      </div>
      <div class="cal-row cal-body-row">
        <div class="cal-time-col">${timeCells}</div>
        <div class="cal-days">${daysHtml}</div>
      </div>
    </div>`;
  }

  // 주차별 캘린더 (active week만 보여줘 한 화면에 부담 없게)
  const wksAll=buildWeeks(dates).map((w,i)=>{
    const range=w.filter(dd=>dd.inRange).map(dd=>dd.date);
    return {idx:i,dates:w,range};
  }).filter(w=>w.range.length>0);
  const activeWk=wksAll[Math.min(Math.max(state.activeWeek||0,0), wksAll.length-1)]||null;
  const finalTabsHtml=wksAll.length>1?`<div class="week-tabs">
    ${wksAll.map((w,i)=>{
      const rng=w.range.length>1
        ?`${mdLabel(w.range[0])} ~ ${mdLabel(w.range[w.range.length-1])}`
        :mdLabel(w.range[0]);
      const on=activeWk&&activeWk.idx===w.idx;
      return `<button class="week-tab ${on?'on':''}" data-act="pickweek" data-w="${i}">
        ${w.idx+1}주차<span class="wkn">${rng}</span></button>`;
    }).join('')}
  </div>`:'';

  const calHtml=activeWk?renderCalWeek(activeWk.dates):'';
  const filterLabel=filterUid?`${esc(itemName(c.people[filterUid]))} 님의 일정`:'전체 일정';

  // 활동별 요약
  const sumBySid={};
  blocks.forEach(b=>{
    const dur=parseTime(b.end)-parseTime(b.start);
    const e=sumBySid[b.sid]||{count:0,minutes:0,list:[]};
    e.count++; e.minutes+=dur; e.list.push(b);
    sumBySid[b.sid]=e;
  });
  const songOrder=sortedIds(c.songs||{});
  const summaryRows=songOrder
    .filter(sid=>sumBySid[sid])
    .map(sid=>{
      const e=sumBySid[sid];
      const songNm=itemName(c.songs[sid]);
      const sessionList=e.list
        .slice().sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start))
        .map(b=>{
          const wd=['일','월','화','수','목','금','토'][wdOf(b.date)];
          return `<span class="fs-sess${b.ext?' ext':''}">${mdLabel(b.date)}(${wd}) ${b.start}–${b.end}${b.ext?' 외부':''}</span>`;
        }).join('');
      return `<div class="fs-row" style="--sc:${songColor(sid)}">
        <span class="fs-dot"></span>
        <span class="fs-name">${esc(songNm)}</span>
        <span class="fs-count">${e.count}회 · ${fmtDur(e.minutes)}</span>
        <span class="fs-list">${sessionList}</span>
      </div>`;
    }).join('');
  const totalMin=blocks.reduce((s,b)=>s+(parseTime(b.end)-parseTime(b.start)),0);
  const summaryHtml=blocks.length?`<div class="fs-card">
    <div class="fs-head">
      <span class="fs-h-label">활동별 일정 요약</span>
      <span class="fs-h-total">총 ${blocks.length}회 · ${fmtDur(totalMin)}</span>
    </div>
    <div class="fs-list-wrap">${summaryRows}</div>
  </div>`:'';

  const finalCard=`<div class="card">
    <div class="card-head">
      <div>
        <h2>최종 시간표</h2>
        <div class="sub" style="margin:4px 0 0">배정된 일정을 캘린더 형태로 표시합니다. 참여자 필터를 걸면 그 사람의 일정만 봅니다.</div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <select data-act="filtermember">${memberOpts}</select>
        <button class="btn sm" data-act="sheetexport" ${blocks.length?'':'disabled'}>📋 시트로 복사</button>
        <button class="btn ghost sm" data-act="exportpng" ${blocks.length?'':'disabled'}>📷 PNG</button>
        <button class="btn ghost sm" data-act="exportics" ${blocks.length?'':'disabled'}>📅 .ics (1회 가져오기)</button>
      </div>
    </div>
    ${finalTabsHtml}
    <div id="final-snapshot">
      <div class="fd-title">${esc(c.name||'일정')} <span class="fd-subtitle">· ${filterLabel}</span></div>
      ${summaryHtml}
      ${blocks.length
        ? `<div id="cal-snapshot">${calHtml}</div>`
        : `<div class="empty" style="padding:30px 12px">아직 배정된 시간표가 없습니다. 위 그리드에서 칸을 클릭해 배정해 보세요.</div>`}
    </div>
  </div>`;

  return gridCard + finalCard;
}

/* ---- 상세 탭: 활동별 참여자 가능 캘린더 ---- */
function viewResultsDetail(){
  const c=state.config;
  if(!c) return '<div class="card"><div class="empty">프로젝트를 먼저 만드세요.</div></div>';
  const sIds=sortedIds(c.songs||{});
  const activeSongs=sIds.filter(s=>songMembers(s).length>0);
  if(!activeSongs.length){
    return `<div class="card"><div class="empty">참여표에서 참여자가 지정된 활동이 없습니다.</div></div>`;
  }

  let selSid=state.detailSong;
  if(!selSid || !activeSongs.includes(selSid)) selSid=activeSongs[0];

  // 활동 선택 칩 (single-select)
  const songChips=activeSongs.map(s=>{
    const on=s===selSid;
    const col=songColor(s);
    const sty=on?`background:${col};border-color:${col};color:${songTextColor(s)}`:'';
    return `<button class="tool-chip ${on?'on':''}" data-act="pickdetailsong" data-sid="${s}" style="${sty}">
      <span class="csw" style="background:${col}"></span>${esc(itemName(c.songs[s]))}
    </button>`;
  }).join('');

  const dates=dateList(c.startDate,c.endDate);
  const times=timeList(c.startHour,c.endHour,c.slotMinutes);
  const members=songMembers(selSid);
  const songNm=itemName(c.songs[selSid]);

  // 통계: 활동 단위 가능 비율
  const totalSlots=dates.length*times.length;
  let feasibleCount=0;
  dates.forEach(d=>times.forEach(t=>{ if(slotOkForSong(selSid, slotKey(d,t))) feasibleCount++; }));
  const memberStats=members.map(u=>{
    const av=state.avail[u]||{};
    let busy=0;
    dates.forEach(d=>times.forEach(t=>{ if(av[slotKey(d,t)]) busy++; }));
    return {uid:u, busy};
  }).sort((a,b)=>b.busy-a.busy);

  // 주차 탭
  const wks=buildWeeks(dates).map((w,i)=>{
    const range=w.filter(d=>d.inRange).map(d=>d.date);
    return {idx:i,dates:w,range};
  }).filter(w=>w.range.length>0);
  const activeIdx=Math.min(Math.max(state.activeWeek||0,0), wks.length-1);
  const active=wks[activeIdx]||null;
  const tabsHtml=wks.length>1?`<div class="week-tabs">
    ${wks.map((w,i)=>{
      const rng=w.range.length>1
        ?`${mdLabel(w.range[0])} ~ ${mdLabel(w.range[w.range.length-1])}`
        :mdLabel(w.range[0]);
      return `<button class="week-tab ${i===activeIdx?'on':''}" data-act="pickweek" data-w="${i}">
        ${w.idx+1}주차<span class="wkn">${rng}</span></button>`;
    }).join('')}
  </div>`:'';

  // Gantt 형태: 각 날짜 → 참여자 sub-col, 각 셀 = (uid, date, time) 가능/불가
  let grid='';
  if(active){
    const N=members.length;
    let dayHead='<th class="gnt-corner" rowspan="2">시간</th>';
    let memHead='';
    active.dates.forEach(day=>{
      const w=wdOf(day.date);
      const wdCls=w===0?'sun':(w===6?'sat':'');
      const outCls=day.inRange?'':'out';
      dayHead+=`<th class="gnt-day ${wdCls} ${outCls}" colspan="${N}">
        ${day.inRange?mdLabel(day.date):''} <span class="wd">${day.inRange?WD[w]:''}</span></th>`;
      members.forEach((uid,mi)=>{
        const last=mi===N-1?'day-end':'';
        const mnm=itemName(c.people[uid]);
        memHead+=`<th class="gnt-sub dtl-sub ${last}" title="${esc(mnm)}">${esc(mnm)}</th>`;
      });
    });

    let rows=times.map(t=>{
      let cells='';
      active.dates.forEach(day=>{
        if(!day.inRange){
          members.forEach((uid,mi)=>{
            const last=mi===N-1?'day-end':'';
            cells+=`<td class="gnt-cell dtl-cell out ${last}"></td>`;
          });
          return;
        }
        const k=slotKey(day.date,t);
        // 전원 OK 여부 (행 단위)
        const allOk=members.every(u=>!(state.avail[u]&&state.avail[u][k]));
        members.forEach((uid,mi)=>{
          const last=mi===N-1?'day-end':'';
          const unav=!!(state.avail[uid]&&state.avail[uid][k]);
          const cls=unav?'dtl-no':(allOk?'dtl-yes-all':'dtl-yes');
          const mnm=itemName(c.people[uid]);
          const ttl=`${esc(mnm)}: ${unav?'안 됨':'가능'}`;
          cells+=`<td class="gnt-cell dtl-cell ${cls} ${last}" title="${ttl}"></td>`;
        });
      });
      return `<tr><td class="rh">${t}</td>${cells}</tr>`;
    }).join('');

    grid=`<div class="scroll tall grid-touch"><table class="grid gantt"><thead>
      <tr>${dayHead}</tr><tr>${memHead}</tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }

  // 참여자 막대 (얼마나 안 되는지 시각화)
  const memberBars=memberStats.map(m=>{
    const ratio=totalSlots?Math.round((m.busy/totalSlots)*100):0;
    return `<div class="dtl-mbar">
      <span class="dtl-mn">${esc(itemName(c.people[m.uid]))}</span>
      <div class="dtl-mb"><div class="dtl-mf" style="width:${ratio}%"></div></div>
      <span class="dtl-mc">${m.busy}칸 (${ratio}%)</span>
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="card-head">
      <div>
        <h2>활동별 참여자 가능 현황</h2>
        <div class="sub" style="margin:4px 0 0">활동을 고르면 그 활동 참여자들의 시간별 가능/불가능이 캘린더 형태로 표시됩니다. <b style="color:var(--ok)">초록</b> = 가능, <b style="color:var(--accent)">빨강</b> = 안 됨. 진한 초록은 그 시간에 전원 가능한 경우입니다.</div>
      </div>
      <span class="badge" style="color:var(--muted)">${feasibleCount}/${totalSlots} 가능</span>
    </div>
    <div class="page-intro">
      <div class="pi-h">🎯 이 페이지는?</div>
      <p>시간표 짜기가 막혔을 때 <b>"이 활동은 누가 막고 있는지"</b> 찾는 진단 페이지입니다. 활동 하나를 고르면 그 활동 참여자들의 시간대별 가능/불가능이 캘린더로 보이고, 아래에 참여자별 안 되는 칸 비율도 표시됩니다.</p>
    </div>
    <div class="song-toggles" style="margin-top:14px">
      <span class="label">활동 선택:</span>
      ${songChips}
    </div>
    ${tabsHtml}
    ${grid||'<div class="empty">날짜·시간 범위를 설정하세요.</div>'}
    ${memberBars?`<div class="dtl-mlist">
      <div class="section-label" style="margin:18px 0 10px">${esc(songNm)} 참여자별 불가 시간 비율</div>
      ${memberBars}
    </div>`:''}
  </div>`;
}

/* ---------------- 이벤트 ---------------- */
function bindEvents(){
  const app=$('app'), hbar=$('hbar');

  function handleClick(e){
    const helpLink=e.target.closest('.help-modal a[href^="#tut-"]');
    if(helpLink){
      e.preventDefault();
      const target=$(helpLink.getAttribute('href').slice(1));
      const body=helpLink.closest('.modal-body');
      if(target&&body){
        const top=target.getBoundingClientRect().top-body.getBoundingClientRect().top+body.scrollTop;
        body.scrollTo({top:Math.max(0,top-8),behavior:'auto'});
      }
      return;
    }
    const t=e.target.closest('[data-act]'); if(!t)return;
    const act=t.dataset.act;
    if(act==='home'){location.href=location.pathname;return;}
    if(act==='copycode'){copyCode();return;}
    if(act==='help'){state.showHelp=true;render();return;}
    if(act==='closehelp'){state.showHelp=false;render();return;}
    if(act==='modal-noop') return;
    if(act==='new'){createProject();return;}
    if(act==='open'){location.href=location.pathname+'?p='+t.dataset.pid;return;}
    if(act==='aggadd'){openAggregateCreate();return;}
    if(act==='aggedit'){openAggregateEdit(t);return;}
    if(act==='dayboard'){state.dayBoard=t.dataset.date;render();return;}
    if(act==='dayboardclose'){state.dayBoard=null;render();return;}
    if(act==='dayboardnav'){
      if(state.dayBoard){state.dayBoard=bdShiftDate(state.dayBoard,Number(t.dataset.d)||0);render();}
      return;
    }
    if(act==='bdcell'){
      if(bdSuppress)return;   // 드래그 직후의 클릭 무시
      const name=(($('bdName')||{}).value||'').trim();
      if(!name){toast('위의 이름 칸을 먼저 채워주세요');const n=$('bdName');if(n)n.focus();return;}
      lsSet('boardName',name);

      const [y,m]=state.aggMonth.split('-').map(Number);

    if(act==='delsong'){delSong(t.dataset.sid);return;}
    if(act==='delperson'){delPerson(t.dataset.uid);return;}

    if(act==='lock'){toggleLock();return;}
    if(act==='delproject'){delProject();return;}
    if(act==='pickweek'){state.activeWeek=+t.dataset.w;render();return;}
    if(act==='pickdetailsong'){state.detailSong=t.dataset.sid;render();return;}
    if(act==='roommode'){state.roomMode=t.dataset.m==='ext'?'ext':'in';render();return;}
    if(act==='grouptoggle'){
      state.groupFilter=state.groupFilter||{};

      else state.groupFilter[gid]=true;
      render(); return;
    }
    if(act==='aggpng'){exportAggPNG();return;}
    if(act==='exportpng'){exportPNG();return;}
    if(act==='exportics'){exportICS();return;}
    if(act==='sheetexport'){const tsv=buildSheetTSV();if(!tsv){toast('배정된 합주가 없습니다');return;}state.sheetExport=tsv;render();return;}
    if(act==='sheetexportclose'){state.sheetExport=null;render();return;}
    if(act==='sheetcopy'){sheetCopy();return;}
    if(act==='pickmember'){
      const uid=t.dataset.uid;
      state.me=uid;

      render();return;

    if(act==='toggledone'){toggleDone();return;}
    if(act==='toggleall'){
      let sIds=sortedIds(state.config.songs||{}).filter(s=>songMembers(s).length>0);
      const sel=Object.keys(state.groupFilter||{}).filter(g=>state.groupFilter[g]&&state.config.groups?.[g]);
      if(sel.length) sIds=sIds.filter(s=>sel.includes(state.config.songs[s]?.gid));
      if(!sIds.length){ render(); return; }
      const allShown=sIds.every(s=>!state.hiddenSongs[s]);
      state.hiddenSongs=state.hiddenSongs||{};
      sIds.forEach(s=>{ if(allShown) state.hiddenSongs[s]=true; else delete state.hiddenSongs[s]; });

  }
  app.addEventListener('click',handleClick);

  /* role=button 요소(프로젝트 목록 등) 키보드 활성화 */
  function handleActKey(e){

    const t=e.target.closest('[role="button"][data-act]'); if(!t)return;
      e.preventDefault();
    handleClick(e);
  }

    if(state.aggEdit){state.aggEdit=null;render();return;}
    if(state.aggSubscribe){state.aggSubscribe=null;render();return;}

  /* 결과 그리드 활동 헤더 탭 → 전체 활동명 토스트 (모바일에서 title 툴팁 대체) */

  /* 동방 사용 보드 — 이름 칸은 입력 즉시 기억 */

  /* 동방 사용 보드 — 마우스 드래그: 내 이름이 없는 칸에서 시작하면 넣기, 있는 칸에서 시작하면 빼기 */
  const bdCellMine=td=>{
    const name=(($('bdName')||{}).value||'').trim(); if(!name)return null;

  app.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='mouse'||e.button!==0)return;
    const td=e.target.closest('td.bd-cell'); if(!td)return;
    const mine=bdCellMine(td); if(mine===null)return;   // 이름 미입력 시 클릭 흐름의 토스트가 안내
    bdDrag={col:td.dataset.col,erase:mine,times:new Set([td.dataset.time])};
