  });
  window.addEventListener('pointermove',e=>{
    if(!bdDrag)return;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const td=el&&el.closest?el.closest('td.bd-cell'):null;
    if(!td||td.dataset.col!==bdDrag.col)return;
    if(bdCellMine(td)!==bdDrag.erase)return;   // 모드에 맞는 칸만 (넣기: 내 이름 없는 칸 / 빼기: 있는 칸)
    if(!bdDrag.times.has(td.dataset.time)){bdDrag.times.add(td.dataset.time);td.classList.add(bdDrag.erase?'bd-prev-del':'bd-prev');}
  });
  window.addEventListener('pointerup',()=>{
    if(!bdDrag)return;
    const drag=bdDrag; bdDrag=null;
    document.querySelectorAll('.bd-prev,.bd-prev-del').forEach(x=>x.classList.remove('bd-prev','bd-prev-del'));
    if(drag.times.size<2)return;   // 한 칸이면 클릭(탭) 흐름이 처리
    bdSuppress=true; setTimeout(()=>{bdSuppress=false;},300);
    const name=(($('bdName')||{}).value||'').trim();
    if(!state.dayBoard||!name)return;
    lsSet('boardName',name);
    drag.times.forEach(tm=>bdApplyToggle(drag.col,tm,name,drag.erase?'remove':'add'));
    doRender();
  });

  /* 랜딩 캘린더 가로 스크롤 그림자 동기화 (scroll 이벤트는 버블링하지 않으므로 capture) */
  app.addEventListener('scroll',e=>{
    if(e.target.classList&&e.target.classList.contains('agg-cal-scroll')) syncAggHint(e.target);
  },true);

  app.addEventListener('change',e=>{
    const t=e.target.closest('[data-act]'); if(!t)return;
    const act=t.dataset.act, v=t.value;
    if(act==='cfgname')cfgUpdate({name:v.trim()||'이름 없음'});
    else if(act==='cfgstart')cfgUpdate({startDate:v});
    else if(act==='cfgend'){
      if(state.config&&v<state.config.startDate){alert('종료일은 시작일 이후여야 합니다.');render();return;}
      cfgUpdate({endDate:v});}
    else if(act==='cfgsh'){
      if(+v>=state.config.endHour){alert('시작 시각은 종료 시각보다 빨라야 합니다.');render();return;}
      cfgUpdate({startHour:+v});}
    else if(act==='cfgeh'){
      if(+v<=state.config.startHour){alert('종료 시각은 시작 시각보다 늦어야 합니다.');render();return;}
      cfgUpdate({endHour:+v});}
    else if(act==='cfgslot')cfgUpdate({slotMinutes:+v});
    else if(act==='songname'){
      if(cfgLocked()) return;
      const cur=state.config.songs?.[t.dataset.sid];
      const ts=itemTs(cur);
      const obj={name:v.trim()||'활동',ts};
      if(cur?.gid) obj.gid=cur.gid;
      FB.set(R('projects/'+state.pid+'/config/songs/'+t.dataset.sid),obj);
    }
    else if(act==='personname'){
      if(cfgLocked()) return;
      const uid=t.dataset.uid;
      const cur=state.config.people?.[uid];
      const ts=itemTs(cur);
      const newName=v.trim()||'참여자';
      // 같은 이름의 다른 인물이 있나? → 자동 합치기
      const other=Object.keys(state.config.people||{}).find(u=>u!==uid && (state.config.people[u]?.name||'').trim().toLowerCase()===newName.toLowerCase());
      if(other){ mergePerson(uid,other); doRender(); return; }
      FB.set(R('projects/'+state.pid+'/config/people/'+uid),{name:newName,ts});
    }
    else if(act==='groupname'){ renameGroup(t.dataset.gid, v.trim()); }
    else if(act==='pickme'){state.me=v||null;
      if(state.me)lsSet('me_'+state.pid,state.me);render();}
    else if(act==='togglesong'){
      const sid=t.dataset.sid;
      if(t.checked) delete state.hiddenSongs[sid];
      else state.hiddenSongs[sid]=true;
      render();
    }
    else if(act==='filtermember'){
      state.finalFilter=v||'';
      render();
    }
    else if(act==='aggproject'){
      state.aggProject=v||'';
      state.aggMember='';
      render();
    }
    else if(act==='aggmember'){
      state.aggMember=v||'';
      render();
    }
    else if(act==='aggcreateproject'){
      changeAggregateCreateProject(v);
    }
    else if(act==='aggeditfield'&&state.aggEdit){
      state.aggEdit[t.dataset.field]=v;
    }
    else if(act==='aggeditdt'&&state.aggEdit){
      const d=$('aggEditDate'), f=$('aggEditFrom'), to=$('aggEditTo');
      if(d&&f&&to){
        const cfg=state.allSched?.[state.aggEdit.pid]?.config;
        if(d.value&&cfg){   // 기간 밖 날짜는 프로젝트 범위로 되돌림 (ISO 문자열 비교)
          if(cfg.startDate&&d.value<cfg.startDate){d.value=cfg.startDate;toast('프로젝트 기간 안의 날짜만 선택할 수 있습니다');}
          if(cfg.endDate&&d.value>cfg.endDate){d.value=cfg.endDate;toast('프로젝트 기간 안의 날짜만 선택할 수 있습니다');}
        }
        if(!d.value) return;   // 날짜 입력이 비면 이전 값 유지
        const sm=Number(cfg?.slotMinutes)||60;
        const fm=Number(f.value); let tm=Number(to.value);
        if(tm<=fm){ tm=fm+sm; to.value=String(tm); }   // 종료가 시작보다 앞이면 자동으로 한 칸 뒤로
        const base=new Date(d.value+'T00:00:00').getTime();
        state.aggEdit.start=dateTimeLocalValue(base+fm*60000);
        state.aggEdit.end=dateTimeLocalValue(base+tm*60000);
      }
    }
  });

  app.addEventListener('input',e=>{
    const t=e.target.closest('[data-act="aggeditfield"]');
    if(t&&state.aggEdit) state.aggEdit[t.dataset.field]=t.value;
  });

  app.addEventListener('blur',e=>{
    if(e.target.tagName==='INPUT'&&e.target.type==='text'&&deferRender){
      deferRender=false; setTimeout(render,30);
    }
  },true);

  /* Enter 키로 다음 입력란 / 새 항목 추가 */
  app.addEventListener('keydown',e=>{
    if(e.key!=='Enter') return;
    const t=e.target;
    if(t.tagName!=='INPUT') return;
    const act=t.dataset.act;
    if(act!=='songname'&&act!=='personname') return;
    if(cfgLocked()) return;
    e.preventDefault();
    const isSong=act==='songname';
    const dataKey=isSong?'sid':'uid';
    const fbPath=isSong?'songs':'people';
    const defaultName=isSong?'활동':'참여자';
    const id=t.dataset[dataKey];
    // 현재 입력 값 저장. songname은 gid 보존, personname은 같은 이름이면 머지.
    const map=isSong?state.config.songs:state.config.people;
    const cur=map?.[id];
    const ts=itemTs(cur);
    const obj={name:t.value.trim()||defaultName,ts};
    if(isSong && cur?.gid) obj.gid=cur.gid;
    if(!isSong){
      const other=Object.keys(state.config.people||{}).find(u=>u!==id && (state.config.people[u]?.name||'').trim().toLowerCase()===obj.name.toLowerCase());
      if(other){ mergePerson(id,other); doRender(); return; }
    }
    if(map) map[id]=obj;
    FB.set(R('projects/'+state.pid+'/config/'+fbPath+'/'+id),obj);
    // 같은 그룹 리스트에서 다음 입력란 또는 끝이면 새로 추가
    let listSel='input[data-act="'+act+'"]';
    if(t.dataset.gid) listSel+='[data-gid="'+t.dataset.gid+'"]';
    const list=Array.from($('app').querySelectorAll(listSel));
    const idx=list.indexOf(t);
    if(idx>=0&&idx<list.length-1){
      list[idx+1].focus(); list[idx+1].select();
    } else {
      if(isSong) addSong(t.dataset.gid);
      else addNewMemberToGroup(t.dataset.gid);
      deferRender=false; doRender();
      const fresh=$('app').querySelectorAll(listSel);
      if(fresh.length){ const last=fresh[fresh.length-1]; last.focus(); last.select(); }
    }
  });

  /* 그리드 칠하기 — 박스 드래그 (상하좌우) — 데스크탑 즉시, 모바일은 long-press */
  let paintTarget=true, startCell=null, sx=0, sy=0, pType='';
  let dragR0=0, dragC0=0, dragR1=0, dragC1=0;
  let snapshot={}, dragGrid=null;
  let touchHoldTimer=null;
  const LONG_PRESS_MS=320;
  /* 드래그 중에는 터치 스크롤 개입 자체를 차단 (touch-action과 달리 제스처 도중에도 유효) */
  const stopTouchScroll=e=>{ if(e.cancelable) e.preventDefault(); };
  const enterDrag=()=>{
    document.body.classList.add('dragging');
    document.addEventListener('touchmove',stopTouchScroll,{passive:false});
  };
  const exitDrag=()=>{
    document.body.classList.remove('dragging');
    document.removeEventListener('touchmove',stopTouchScroll);
  };

  function applyBox(){
    if(!dragGrid) return;
    const minR=Math.min(dragR0,dragR1), maxR=Math.max(dragR0,dragR1);
    const minC=Math.min(dragC0,dragC1), maxC=Math.max(dragC0,dragC1);
    dragGrid.querySelectorAll('td.cell[data-cell]').forEach(td=>{
      const r=+td.dataset.r, c=+td.dataset.c;
      const inBox=r>=minR&&r<=maxR&&c>=minC&&c<=maxC;
      td.classList.toggle('no', inBox ? paintTarget : !!snapshot[td.dataset.slot]);
    });
  }
  function commitBox(){
    if(!dragGrid) return;
    const minR=Math.min(dragR0,dragR1), maxR=Math.max(dragR0,dragR1);
    const minC=Math.min(dragC0,dragC1), maxC=Math.max(dragC0,dragC1);
    const updates={};
    state.avail[state.me]=state.avail[state.me]||{};
    dragGrid.querySelectorAll('td.cell[data-cell]').forEach(td=>{
      const r=+td.dataset.r, c=+td.dataset.c;
      if(r<minR||r>maxR||c<minC||c>maxC) return;
      const k=td.dataset.slot;
      const had=!!snapshot[k];
      if(paintTarget===had) return;
      if(paintTarget){ state.avail[state.me][k]=true; updates[k]=true; }
      else { delete state.avail[state.me][k]; updates[k]=null; }
    });
    if(Object.keys(updates).length)
      FB.update(R('projects/'+state.pid+'/avail/'+state.me),updates).catch(wErr);
  }
  function singleTap(td){
    const on=!td.classList.contains('no');
    const k=td.dataset.slot;
    td.classList.toggle('no',on);
    state.avail[state.me]=state.avail[state.me]||{};
    const upd={};
    if(on){ state.avail[state.me][k]=true; upd[k]=true; }
    else { delete state.avail[state.me][k]; upd[k]=null; }
    FB.update(R('projects/'+state.pid+'/avail/'+state.me),upd).catch(wErr);
  }

  function startParticipateDrag(td){
    paintTarget=!td.classList.contains('no');
    dragR0=dragR1=+td.dataset.r;
    dragC0=dragC1=+td.dataset.c;
    snapshot={...(state.avail[state.me]||{})};
    dragGrid=td.closest('table');
    painting=true;
    enterDrag();
    applyBox();
  }
  app.addEventListener('pointerdown',e=>{
    const td=e.target.closest('td.cell[data-cell]'); if(!td||!state.me)return;
    pType=e.pointerType; startCell=td; sx=e.clientX; sy=e.clientY;
    if(pType==='mouse'){
      e.preventDefault();
      startParticipateDrag(td);
    } else {
      // 터치: long-press로 드래그 진입
      if(touchHoldTimer)clearTimeout(touchHoldTimer);
      const pid=e.pointerId;
      touchHoldTimer=setTimeout(()=>{
        touchHoldTimer=null;
        try{td.setPointerCapture(pid);}catch(_){}
        startParticipateDrag(td);
        if(navigator.vibrate)try{navigator.vibrate(15);}catch(_){}
      },LONG_PRESS_MS);
    }
  });
  app.addEventListener('pointermove',e=>{
    if(touchHoldTimer){
      if(Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy)>10){
        clearTimeout(touchHoldTimer);touchHoldTimer=null;
      }
      return;
    }
    if(!painting||pType==='mouse') return; // 마우스는 pointerover로 처리
    e.preventDefault();
    const el=document.elementFromPoint(e.clientX,e.clientY);
    if(!el) return;
    const td=el.closest('td.cell[data-cell]'); if(!td) return;
    if(td.closest('table')!==dragGrid) return;
    const r=+td.dataset.r, c=+td.dataset.c;
    if(r===dragR1&&c===dragC1) return;
    dragR1=r; dragC1=c;
    applyBox();
  },{passive:false});
  app.addEventListener('pointerover',e=>{
    if(!painting||pType!=='mouse')return;
    const td=e.target.closest('td.cell[data-cell]'); if(!td)return;
    if(td.closest('table')!==dragGrid) return;
    const r=+td.dataset.r, c=+td.dataset.c;
    if(r===dragR1&&c===dragC1)return;
    dragR1=r; dragC1=c;
    applyBox();
  });
  window.addEventListener('pointerup',e=>{
    if(touchHoldTimer){
      clearTimeout(touchHoldTimer);touchHoldTimer=null;
      if(startCell&&pType!=='mouse'){
        const moved=Math.abs(e.clientX-sx)+Math.abs(e.clientY-sy);
        const td=document.elementFromPoint(e.clientX,e.clientY);
        if(moved<12&&td&&td.closest('td.cell')===startCell&&state.me){
          singleTap(startCell);
        }
      }
      startCell=null;
      return;
    }
    if(painting){
      painting=false;
      commitBox();
      dragGrid=null;
      exitDrag();
      if(deferRender){deferRender=false;render();}
      return;
    }
  });

  /* 간트 sub-cell — 같은 sub-col(활동×날짜) 안에서 세로 드래그로 시간 범위 토글, 모바일은 long-press */
  let gGrid=null, gSid='', gCol='', gR0=0, gR1=0;
  let gSnap={}, gFlipTo=true;
  let gTouchCell=null, gSx=0, gSy=0;
  let gTouchHoldTimer=null;

  function canAssignAt(sid,k){
    return slotOkForSong(sid,k) && slotConflicts(sid,k,roomModeExt()).length===0;
  }
  function renderGanttCell(td,sid,k,assigned,ext){
    td.classList.remove('has','feasible','infeasible','conflict','ext','locked');
    td.style.background=''; td.innerHTML='';
    if(assigned){
      td.classList.add('has'); if(ext) td.classList.add('ext');
      if(ext!==roomModeExt()) td.classList.add('locked');   // 다른 장소 → 현재 모드에선 보호
      td.style.background=songColor(sid);
      if(ext) td.innerHTML='<span class="gnt-ext">🌐</span>';
      return;
    }
    if(!slotOkForSong(sid,k)){ td.classList.add('infeasible'); return; }
    if(slotConflicts(sid,k,roomModeExt()).length){ td.classList.add('conflict'); return; }
    td.classList.add('feasible'); td.style.background=songColorLight(sid);
  }
  function applyGanttDrag(){
    if(!gGrid) return;
    const minR=Math.min(gR0,gR1), maxR=Math.max(gR0,gR1);
    gGrid.querySelectorAll(`td.gnt-cell[data-col="${gCol}"]`).forEach(td=>{
      const r=+td.dataset.r, k=td.dataset.slot;
      const wasVal=gSnap[k], wasAssigned=!!wasVal, wasExt=wasVal==='e';
      const protectedCell = wasAssigned && (wasExt!==roomModeExt());   // 다른 장소 → 그대로 둠
      let nowAssigned=wasAssigned, nowExt=wasExt;
      if(r>=minR&&r<=maxR && !protectedCell){
        if(gFlipTo){ const ok=canAssignAt(gSid,k); nowAssigned=ok?true:wasAssigned; nowExt=ok?roomModeExt():wasExt; }
        else nowAssigned=false;
      }
      renderGanttCell(td,gSid,k,nowAssigned,nowExt);
    });
  }
  function commitGanttDrag(){
    if(!gGrid) return;
    const minR=Math.min(gR0,gR1), maxR=Math.max(gR0,gR1);
    const val=roomModeExt()?'e':true;
    const updates={};
    gGrid.querySelectorAll(`td.gnt-cell[data-col="${gCol}"]`).forEach(td=>{
      const r=+td.dataset.r;
      if(r<minR||r>maxR) return;
      const k=td.dataset.slot;
      const was=gSnap[k]||null;                       // 원래 값(true|'e'|null)
      if(was && ((was==='e')!==roomModeExt())) return; // 다른 장소 칸은 보호 — 건드리지 않음
      const target = gFlipTo ? (canAssignAt(gSid,k)?val:was) : null;
      if(target!==was) updates[k]= target;
    });
    if(!Object.keys(updates).length) return;
    state.schedule[gSid]=state.schedule[gSid]||{};
    for(const k in updates){
      if(updates[k]) state.schedule[gSid][k]=updates[k];
      else delete state.schedule[gSid][k];
    }
    FB.update(R('projects/'+state.pid+'/schedule/'+gSid),updates).catch(wErr);
  }
  function ganttSingleTap(td){
    const sid=td.dataset.sid, k=td.dataset.slot;
    if(isAssigned(sid,k)){
      if(slotIsExt(sid,k)!==roomModeExt()){            // 다른 장소 배정 → 보호
        const ce=slotIsExt(sid,k);
        toast(`${ce?'외부':'동방'} 배정이에요 — ${ce?'외부':'동방'} 모드에서 수정하세요`); return;
      }
      state.schedule[sid]=state.schedule[sid]||{};
      delete state.schedule[sid][k];
      FB.update(R('projects/'+state.pid+'/schedule/'+sid),{[k]:null}).catch(wErr);
      return;
    }
    if(!slotOkForSong(sid,k)){ toast('이 시간엔 참여자가 안 됩니다'); return; }
    const cfs=slotConflicts(sid,k,roomModeExt());
    if(cfs.length){
      toast(conflictMessage(cfs)); return;
    }
    const val=roomModeExt()?'e':true;
    state.schedule[sid]=state.schedule[sid]||{};
    state.schedule[sid][k]=val;
    FB.update(R('projects/'+state.pid+'/schedule/'+sid),{[k]:val}).catch(wErr);
  }

  function startGanttDrag(td){
    if(td.classList.contains('infeasible')||td.classList.contains('conflict')){
      gGrid=null; return false;
    }
    gSid=td.dataset.sid;
    gCol=td.dataset.col;
    gR0=gR1=+td.dataset.r;
    gGrid=td.closest('table');
    gSnap={...(state.schedule[gSid]||{})};
    const sv=gSnap[td.dataset.slot];                   // true|'e'|undefined
    const startSameMode = sv && ((sv==='e')===roomModeExt());
    gFlipTo=!startSameMode;                             // 현재모드 배정칸에서 시작 → 해제, 그 외 → 배정
    gPainting=true;
    enterDrag();
    applyGanttDrag();
    return true;
  }
  app.addEventListener('pointerdown',e=>{
    const td=e.target.closest('td.gnt-cell[data-gantt]'); if(!td) return;
    if(e.pointerType==='mouse'){
      e.preventDefault();
      startGanttDrag(td);
    } else {
      gTouchCell=td; gSx=e.clientX; gSy=e.clientY;
      if(gTouchHoldTimer)clearTimeout(gTouchHoldTimer);
      const pid=e.pointerId;
      gTouchHoldTimer=setTimeout(()=>{
        gTouchHoldTimer=null;
        try{td.setPointerCapture(pid);}catch(_){}
        if(startGanttDrag(td)){
          if(navigator.vibrate)try{navigator.vibrate(15);}catch(_){}
        }
      },LONG_PRESS_MS);
    }
  });
  app.addEventListener('pointermove',e=>{
    if(gTouchHoldTimer){
      if(Math.abs(e.clientX-gSx)+Math.abs(e.clientY-gSy)>10){
        clearTimeout(gTouchHoldTimer);gTouchHoldTimer=null;
      }
      return;
    }
    if(!gPainting||e.pointerType==='mouse') return; // 마우스는 pointerover로
    e.preventDefault();
    const el=document.elementFromPoint(e.clientX,e.clientY);
    if(!el) return;
    const td=el.closest('td.gnt-cell[data-gantt]'); if(!td) return;
    if(td.closest('table')!==gGrid) return;
    if(td.dataset.col!==gCol) return;
    const r=+td.dataset.r;
    if(r===gR1) return;
    gR1=r;
    applyGanttDrag();
  },{passive:false});
  app.addEventListener('pointerover',e=>{
    if(!gPainting||e.pointerType!=='mouse') return;
    const td=e.target.closest('td.gnt-cell[data-gantt]'); if(!td) return;
    if(td.closest('table')!==gGrid) return;
    if(td.dataset.col!==gCol) return;
    const r=+td.dataset.r;
    if(r===gR1) return;
    gR1=r;
    applyGanttDrag();
  });
  window.addEventListener('pointerup',e=>{
    if(gTouchHoldTimer){
      clearTimeout(gTouchHoldTimer);gTouchHoldTimer=null;
      if(gTouchCell){
        const moved=Math.abs(e.clientX-gSx)+Math.abs(e.clientY-gSy);
        const td=document.elementFromPoint(e.clientX,e.clientY);
        if(moved<12&&td&&td.closest('td.gnt-cell')===gTouchCell){
          ganttSingleTap(gTouchCell);
        }
      }
      gTouchCell=null;
      return;
    }
    if(gPainting){
      gPainting=false;
      commitGanttDrag();
      gGrid=null;
      exitDrag();
      if(deferRender){deferRender=false;render();}
      return;
    }
    gTouchCell=null;
  });

  /* 시스템 제스처로 포인터가 취소되면 드래그 상태를 안전하게 복구 */
  window.addEventListener('pointercancel',()=>{
    if(touchHoldTimer){clearTimeout(touchHoldTimer);touchHoldTimer=null;}
    if(gTouchHoldTimer){clearTimeout(gTouchHoldTimer);gTouchHoldTimer=null;}
    startCell=null; gTouchCell=null;
    if(painting||gPainting){
      painting=false; gPainting=false;
      dragGrid=null; gGrid=null;
      exitDrag();
      deferRender=false; render();   // state는 커밋 전 그대로이므로 전체 재렌더가 곧 스냅샷 복원
    }
  });
}

/* ---------------- 시작 ---------------- */
async function start(){
  bindEvents(); render();
  const status=await initFirebase();
  if(status==='no-config'){state.screen='no-config';render();return;}
  if(status==='error'){state.screen='fb-error';render();return;}
  watchConnection();
  const params=new URLSearchParams(location.search);
  const pid=params.get('p');
  if(pid){
    state.pid=pid; state.screen='project';
    state.me=lsGet('me_'+pid)||null;
    if(state.me) state.tab='participate';   // 링크 재방문자 → 내 시간 탭에서 시작
    subscribeProject(pid);
    subscribeIndex();
  }else{
    state.screen='landing'; subscribeIndex(); subscribeRoomBoard();
  }
  render();
}
start();
</script>
